/* --- サウンドとBGMの同期 --- */
function syncAudioOnClear(info){
  const k = info.kind;
  if(k === 'pc'){ AU.sfx('pc'); Music.stinger('pc'); }
  else if(k === 'tetris'){
    AU.sfx('tetris'); Music.stinger('tetris');
    if(info.b2b) setTimeout(() => AU.sfx('b2b'), 380);
  }
  else if(k === 'tspin' || k === 'tspin0'){
    AU.sfx('tspin'); Music.stinger('tspin');
    if(info.b2b) setTimeout(() => AU.sfx('b2b'), 360);
  }
  else if(info.n > 0){
    AU.sfx('clear', {n:info.n});
    if(info.b2b){ AU.sfx('b2b'); Music.stinger('b2b'); }
    else AU.duck(0.5, 300);
  }
  if(info.perfect) setTimeout(() => AU.sfx('pc'), 320);
  if(info.combo >= 2) setTimeout(() => AU.sfx('combo', {n:info.combo}), 200);
  if(info.levelUp) setTimeout(() => AU.sfx('levelup'), 340);
}

/* --- 更新 --- */
function fxUpdate(dt){
  const d = dt / 1000;
  // パーティクル
  const parts = FX.parts;
  for(let i = parts.length - 1; i >= 0; i--){
    const p = parts[i];
    p.life += dt;
    if(p.life >= p.max){ parts.splice(i, 1); continue; }
    p.vy += p.g * d;
    p.vx *= Math.pow(p.drag, d);
    p.vy *= Math.pow(p.drag, d);
    p.x += p.vx * d; p.y += p.vy * d;
    p.rot += p.vr * d;
    p.tw += d * 8;
  }
  // リング
  for(let i = FX.rings.length - 1; i >= 0; i--){
    const r = FX.rings[i];
    r.life += dt;
    if(r.life >= r.max2) FX.rings.splice(i, 1);
  }
  // ビーム
  for(let i = FX.beams.length - 1; i >= 0; i--){
    const b = FX.beams[i];
    b.life += dt;
    if(b.life >= b.max) FX.beams.splice(i, 1);
  }
  // 落下跡
  for(let i = FX.streaks.length - 1; i >= 0; i--){
    const s = FX.streaks[i];
    s.life += dt;
    if(s.life >= s.max) FX.streaks.splice(i, 1);
  }
  // グリッチ
  for(let i = FX.glitches.length - 1; i >= 0; i--){
    const g = FX.glitches[i];
    g.life += dt;
    if(g.life >= g.max) FX.glitches.splice(i, 1);
  }
  // ポップアップ
  for(let i = FX.pops.length - 1; i >= 0; i--){
    const p = FX.pops[i];
    p.life += dt;
    p.y -= dt * 0.018;
    if(p.life >= p.max) FX.pops.splice(i, 1);
  }
  // 衰減
  FX.shake *= Math.pow(0.88, dt / 16.7);
  FX.pageShake *= Math.pow(0.86, dt / 16.7);
  FX.flashA *= Math.pow(0.90, dt / 16.7);
  FX.warpA *= Math.pow(0.94, dt / 16.7);
  FX.chroma *= Math.pow(0.93, dt / 16.7);
  FX.holdPulse *= Math.pow(0.90, dt / 16.7);

  // 危険域の脈動
  const top = stackTopRow();
  const danger = (G.phase === 'play' || G.phase === 'clear') && top <= HIDDEN + 3;
  FX.dangerA = danger ? Math.min(1, FX.dangerA + dt / 300) : Math.max(0, FX.dangerA - dt / 500);
  if(danger){
    if(!G.danger){ G.danger = true; AU.sfx('danger'); }
    G.dangerT = (G.dangerT || 0) + dt;
    if(G.dangerT > 780){ G.dangerT = 0; AU.sfx('danger'); }
  }else{
    G.danger = false; G.dangerT = 0;
  }

  // BGMビート → 画面脉動
  let pulse = 0;
  for(let i = VisualBeats.length - 1; i >= 0; i--){
    const b = VisualBeats[i];
    const ago = performance.now() - b.t;
    if(ago >= 0 && ago < 420){
      pulse = (1 - ago / 420) * (b.strong ? 1 : 0.55);
      break;
    }
  }
  FX.beatPulse = pulse;
}
/* =========================================================
 *  RENDER
 * ========================================================= */
const SPRITES = {};
function tintA(h, f, a){
  const [r,g,b] = hexToRgb(h);
  const k = v => clamp(Math.round(f > 1 ? v + (255 - v) * (f - 1) : v * f), 0, 255);
  return `rgba(${k(r)},${k(g)},${k(b)},${a})`;
}
function blockSprite(color){
  if(SPRITES[color]) return SPRITES[color];
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const c = document.createElement('canvas');
  c.width = c.height = Math.round(CELL * dpr);
  const x = c.getContext('2d');
  x.scale(dpr, dpr);
  const r = 5;
  const g = x.createLinearGradient(0, 0, CELL, CELL);
  g.addColorStop(0, shade(color, 1.65));
  g.addColorStop(0.4, color);
  g.addColorStop(1, shade(color, 0.62));
  roundRect(x, 1, 1, CELL - 2, CELL - 2, r);
  x.fillStyle = g; x.fill();
  // 上部ハイライト
  roundRect(x, 3.5, 3.5, CELL - 7, (CELL - 7) * 0.34, 3);
  x.fillStyle = 'rgba(255,255,255,.34)'; x.fill();
  // 下部の芯
  roundRect(x, 4, CELL - 9, CELL - 8, 5, 2.5);
  x.fillStyle = 'rgba(0,0,0,.22)'; x.fill();
  // 枠
  roundRect(x, 1, 1, CELL - 2, CELL - 2, r);
  x.strokeStyle = tintA(color, 1.9, 0.85); x.lineWidth = 1.4; x.stroke();
  SPRITES[color] = c;
  return c;
}

function drawBG(c, t){
  const hue = (G.tier * 34 + G.level * 3 + 210) % 360;
  c.fillStyle = '#050711';
  c.fillRect(0, 0, W, H);
  const tt = t / 1000;
  for(let i = 0; i < 2; i++){
    const bx = W / 2 + Math.sin(tt * 0.35 + i * 2.1) * W * 0.34;
    const by = H / 2 + Math.cos(tt * 0.28 + i * 1.7) * H * 0.3;
    const rad = W * (0.55 + i * 0.2);
    const g = c.createRadialGradient(bx, by, 4, bx, by, rad);
    const hh = (hue + i * 60) % 360;
    g.addColorStop(0, `hsla(${hh},90%,55%,.17)`);
    g.addColorStop(1, `hsla(${hh},90%,55%,0)`);
    c.fillStyle = g; c.fillRect(0, 0, W, H);
  }
  // グリッド
  const pulse = FX.beatPulse;
  c.lineWidth = 1;
  c.strokeStyle = `rgba(150,200,255,${0.055 + pulse * 0.10})`;
  c.beginPath();
  for(let x = 1; x < COLS; x++){ c.moveTo(x * CELL + .5, 0); c.lineTo(x * CELL + .5, H); }
  for(let y = 1; y < VROWS; y++){ c.moveTo(0, y * CELL + .5); c.lineTo(W, y * CELL + .5); }
  c.stroke();
  // ビートの中心光
  if(pulse > 0.01){
    const g = c.createRadialGradient(W / 2, H / 2, 10, W / 2, H / 2, H * 0.62);
    g.addColorStop(0, `rgba(255,255,255,${0.055 * pulse})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
  }
  // 危険ライン
  if(FX.dangerA > 0.02){
    const y = 3 * CELL;
    c.strokeStyle = `rgba(255,50,80,${0.35 * FX.dangerA * (0.6 + 0.4 * Math.sin(t / 90))})`;
    c.lineWidth = 2;
    c.setLineDash([8, 6]);
    c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke();
    c.setLineDash([]);
  }
}

function drawCellAt(c, x, y, color, alpha){
  if(y < HIDDEN) return;
  c.globalAlpha = alpha == null ? 1 : alpha;
  c.drawImage(blockSprite(color), x * CELL, (y - HIDDEN) * CELL, CELL, CELL);
  c.globalAlpha = 1;
}

function drawBoard(t){
  const c = bctx;
  c.clearRect(0,0,W,H);
  drawBG(c, t);

  // 固定ブロック
  for(let y = HIDDEN; y < ROWS; y++){
    for(let x = 0; x < COLS; x++){
      if(board[y][x]) drawCellAt(c, x, y, board[y][x]);
    }
  }

  // ロック直後の白フラッシュ
  if(G.lockFlash){
    G.lockFlash.t += 16;
    if(G.lockFlash.t > 240) G.lockFlash = null;
    else{
      const a = 1 - G.lockFlash.t / 240;
      c.globalCompositeOperation = 'lighter';
      c.fillStyle = `rgba(255,255,255,${a * 0.75})`;
      G.lockFlash.cells.forEach(([gx,gy]) => {
        if(gy < HIDDEN) return;
        roundRect(c, gx * CELL + 1, (gy - HIDDEN) * CELL + 1, CELL - 2, CELL - 2, 5);
        c.fill();
      });
      c.globalCompositeOperation = 'source-over';
    }
  }

  // ライン消去アニメ
  if(G.phase === 'clear' && G.clearRows.length){
    const p = clamp(1 - G.clearT / CLEAR_MS, 0, 1);
    G.clearRows.forEach(row => {
      if(row < HIDDEN) return;
      const cy = (row - HIDDEN) * CELL + CELL / 2;
      for(let x = 0; x < COLS; x++){
        const col = board[row][x]; if(!col) continue;
        const cx = x * CELL + CELL / 2;
        let sx = 1, alpha = 1, white = 0;
        if(p < 0.28){ white = p / 0.28; sx = 1 + white * 0.14; }
        else{
          const q = (p - 0.28) / 0.72;
          sx = Math.max(0, 1 - easeInCubic(q));
          alpha = 1 - q * 0.35;
          white = 1 - q * 0.55;
        }
        c.save();
        c.translate(cx, cy); c.scale(sx, 1);
        c.globalAlpha = alpha;
        c.drawImage(blockSprite(col), -CELL / 2, -CELL / 2, CELL, CELL);
        if(white > 0.02){
          c.globalCompositeOperation = 'lighter';
          c.fillStyle = `rgba(255,255,255,${white * 0.9})`;
          roundRect(c, -CELL / 2 + 1, -CELL / 2 + 1, CELL - 2, CELL - 2, 5);
          c.fill();
          c.globalCompositeOperation = 'source-over';
        }
        c.restore();
      }
      // 横スパーク
      if(p < 0.5){
        c.globalCompositeOperation = 'lighter';
        const a = (0.5 - p) * 2;
        const g = c.createLinearGradient(0, 0, W, 0);
        g.addColorStop(0, 'rgba(255,255,255,0)');
        g.addColorStop(0.5, `rgba(255,255,255,${a * 0.85})`);
        g.addColorStop(1, 'rgba(255,255,255,0)');
        c.fillStyle = g;
        c.fillRect(0, cy - 2, W, 4);
        c.globalCompositeOperation = 'source-over';
      }
    });
  }

  // ゴースト
  const p = G.piece;
  if(p && G.phase === 'play'){
    const gy = ghostY();
    const cells = occupied(MAT[p.t][p.rot]);
    const col = PIECE_DEF[p.t].c;
    c.save();
    c.lineWidth = 2;
    c.setLineDash([5, 4]);
    c.strokeStyle = tintA(col, 1, 0.55);
    c.fillStyle = tintA(col, 1, 0.12);
    cells.forEach(([cx,cy]) => {
      const yy = gy + cy;
      if(yy < HIDDEN) return;
      roundRect(c, (p.x + cx) * CELL + 2, (yy - HIDDEN) * CELL + 2, CELL - 4, CELL - 4, 4);
      c.fill(); c.stroke();
    });
    c.restore();

    // 落下予測ライン
    c.save();
    c.globalAlpha = 0.18 + FX.beatPulse * 0.1;
    c.fillStyle = col;
    cells.forEach(([cx,cy]) => {
      const yy = gy + cy;
      if(yy < HIDDEN) return;
      c.fillRect((p.x + cx) * CELL + 3, (yy - HIDDEN) * CELL + CELL - 4, CELL - 6, 2);
    });
    c.restore();
  }

  // 操作中のピース
  if(p && G.phase === 'play'){
    const col = PIECE_DEF[p.t].c;
    const cells = occupied(MAT[p.t][p.rot]);
    c.save();
    c.shadowColor = col;
    c.shadowBlur = 14 + FX.beatPulse * 8;
    cells.forEach(([cx,cy]) => {
      const yy = p.y + cy;
      if(yy < HIDDEN) return;
      drawCellAt(c, p.x + cx, yy, col);
    });
    c.restore();
    // 彩色収差 (シャドウ用に輪郭を重ねる)
    if(FX.chroma > 0.05){
      c.save();
      c.globalCompositeOperation = 'lighter';
      c.globalAlpha = FX.chroma * 0.35;
      c.fillStyle = '#ff2050';
      cells.forEach(([cx,cy]) => {
        const yy = p.y + cy; if(yy < HIDDEN) return;
        c.fillRect((p.x + cx) * CELL + 2, (yy - HIDDEN) * CELL + 1, CELL - 4, CELL - 2);
      });
      c.restore();
    }
  }
}

/* --- フルスクリーン演出レイヤー --- */
function drawFX(){
  const c = fctx;
  c.clearRect(0, 0, FW, FH);

  /* ハードドロップの軌跡 */
  c.save();
  c.globalCompositeOperation = 'lighter';
  FX.streaks.forEach(s => {
    const t = s.life / s.max, a = (1 - t) * 0.6;
    const g = c.createLinearGradient(0, s.y0, 0, s.y1);
    g.addColorStop(0, 'rgba(255,255,255,0)');
    g.addColorStop(1, rgba(s.color, a));
    c.fillStyle = g;
    c.fillRect(s.x - s.w / 2, s.y0, s.w, Math.max(1, s.y1 - s.y0));
  });
  c.restore();

  /* レーザー */
  c.save();
  c.globalCompositeOperation = 'lighter';
  FX.beams.forEach(b => {
    const t = b.life / b.max, a = Math.pow(1 - t, 1.6);
    if(b.vertical){
      const g = c.createLinearGradient(b.x, b.top, b.x, b.bot);
      g.addColorStop(0, rgba(b.color, 0));
      g.addColorStop(0.5, rgba(b.color, a * 0.9));
      g.addColorStop(1, rgba(b.color, 0));
      c.fillStyle = g;
      const w = b.h * (0.6 + a * 1.6);
      c.fillRect(b.x - w / 2, b.top, w, b.bot - b.top);
    }else{
      const g = c.createLinearGradient(0, 0, FW, 0);
      g.addColorStop(0, rgba(b.color, 0));
      g.addColorStop(0.14, rgba(b.color, a));
      g.addColorStop(0.86, rgba(b.color, a));
      g.addColorStop(1, rgba(b.color, 0));
      c.fillStyle = g;
      const h = b.h * (0.5 + a * 2.2);
      c.fillRect(0, b.y - h / 2, FW, h);
      c.fillStyle = `rgba(255,255,255,${a * 0.9})`;
      c.fillRect(0, b.y - h * 0.16, FW, h * 0.32);
    }
  });
  c.restore();

  /* 衝撃波リング */
  c.save();
  c.globalCompositeOperation = 'lighter';
  FX.rings.forEach(r => {
    const t = r.life / r.max2, a = Math.pow(1 - t, 2);
    const rad = r.r + (r.max - r.r) * easeOutCubic(t);
    c.beginPath();
    c.arc(r.x, r.y, Math.max(1, rad), 0, 6.2832);
    c.strokeStyle = rgba(r.color, a * 0.9);
    c.lineWidth = Math.max(0.5, r.w * (1 - t));
    c.stroke();
    c.beginPath();
    c.arc(r.x, r.y, Math.max(1, rad * 0.72), 0, 6.2832);
    c.strokeStyle = rgba('#ffffff', a * 0.35);
    c.lineWidth = Math.max(0.5, r.w * 0.5 * (1 - t));
    c.stroke();
  });
  c.restore();

  /* パーティクル */
  const parts = FX.parts;
  c.save();
  c.globalCompositeOperation = 'lighter';
  for(let i = 0; i < parts.length; i++){
    const p = parts[i];
    const t = p.life / p.max;
    const a = t < 0.75 ? 1 : 1 - (t - 0.75) / 0.25;
    c.globalAlpha = clamp(a, 0, 1);
    if(p.shape === 'spark'){
      c.strokeStyle = p.color;
      c.lineWidth = p.size;
      c.lineCap = 'round';
      c.beginPath();
      c.moveTo(p.x, p.y);
      c.lineTo(p.x - p.vx * 0.035, p.y - p.vy * 0.035);
      c.stroke();
      c.fillStyle = '#ffffff';
      c.globalAlpha = clamp(a * 0.7, 0, 1);
      c.fillRect(p.x - p.size / 3, p.y - p.size / 3, p.size / 1.6, p.size / 1.6);
    }else if(p.shape === 'star'){
      const s = p.size * (1.6 + Math.sin(p.tw) * 0.5);
      c.fillStyle = p.color;
      c.beginPath();
      for(let k = 0; k < 4; k++){
        const ang = p.rot + k * 1.5708;
        c.moveTo(p.x, p.y);
        c.lineTo(p.x + Math.cos(ang - 0.22) * s, p.y + Math.sin(ang - 0.22) * s);
        c.lineTo(p.x + Math.cos(ang + 0.22) * s, p.y + Math.sin(ang + 0.22) * s);
      }
      c.fill();
      c.fillStyle = '#ffffff';
      c.globalAlpha = clamp(a * 0.8, 0, 1);
      c.beginPath(); c.arc(p.x, p.y, p.size * 0.5, 0, 6.2832); c.fill();
    }
  }
  c.restore();

  /* 固体 (破片・紙吹雪) */
  c.save();
  for(let i = 0; i < parts.length; i++){
    const p = parts[i];
    if(p.shape !== 'cube' && p.shape !== 'confetti') continue;
    const t = p.life / p.max;
    const a = t < 0.7 ? 1 : 1 - (t - 0.7) / 0.3;
    c.save();
    c.globalAlpha = clamp(a, 0, 1);
    c.translate(p.x, p.y);
    c.rotate(p.rot);
    if(p.shape === 'cube'){
      c.fillStyle = p.color;
      c.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      c.fillStyle = 'rgba(255,255,255,.55)';
      c.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.3);
      c.strokeStyle = 'rgba(0,0,0,.5)'; c.lineWidth = 1;
      c.strokeRect(-p.size / 2, -p.size / 2, p.size, p.size);
    }else{
      const w = p.size, h = p.size * (0.45 + Math.abs(Math.sin(p.rot)) * 0.55);
      c.fillStyle = p.color;
      c.fillRect(-w / 2, -h / 2, w, h);
    }
    c.restore();
  }
  c.restore();

  /* グリッチバー */
  c.save();
  FX.glitches.forEach(g => {
    const t = g.life / g.max, a = (1 - t) * 0.6;
    c.globalAlpha = a;
    c.fillStyle = g.color;
    const jx = (Math.random() - 0.5) * 22;
    c.fillRect(g.x + jx, g.y, g.w, g.h);
    c.globalAlpha = a * 0.5;
    c.fillStyle = '#000';
    c.fillRect(g.x - jx, g.y + g.h * 0.3, g.w * 0.7, g.h * 0.4);
  });
  c.restore();

  /* ポップアップ */
  FX.pops.forEach(p => {
    const t = p.life / p.max;
    const inT = clamp(p.life / 190, 0, 1);
    const scale = easeOutBack(inT);
    const alpha = t < 0.7 ? 1 : 1 - (t - 0.7) / 0.3;
    const colors = {
      normal:['#ffffff', '#ffe27a'], tetris:['#39e0ff', '#ffffff'],
      tspin:['#e0a4ff', '#ffffff'], pc:['#fff', '#ffd21e'], tier:['#ffffff', TIERS[G.tier].c],
    };
    const col = colors[p.kind] || colors.normal;
    const y = p.y;
    const size1 = (p.kind === 'pc' || p.kind === 'tier') ? 34 : p.kind === 'tetris' ? 32 : 26;
    c.save();
    c.translate(p.x, y);
    c.scale(scale, scale);
    c.globalAlpha = clamp(alpha, 0, 1);
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.font = `900 ${size1}px "Segoe UI", system-ui, "Hiragino Kaku Gothic ProN", sans-serif`;
    c.lineJoin = 'round';
    c.strokeStyle = 'rgba(0,0,0,.85)';
    c.lineWidth = 7;
    c.strokeText(p.text, 0, 0);
    const g = c.createLinearGradient(-140, -14, 140, 14);
    g.addColorStop(0, col[0]); g.addColorStop(0.5, col[1]); g.addColorStop(1, col[0]);
    c.fillStyle = g;
    c.fillText(p.text, 0, 0);
    if(p.sub){
      c.font = '800 13px "Segoe UI", system-ui, sans-serif';
      c.strokeStyle = 'rgba(0,0,0,.8)'; c.lineWidth = 5;
      c.strokeText(p.sub, 0, 26);
      c.fillStyle = '#9ff3ff';
      c.fillText(p.sub, 0, 26);
    }
    c.restore();
  });
}

/* --- HOLD / NEXT --- */
function drawMini(c, type, cx, cy, box){
  const cells = occupied(MAT[type][0]);
  const w = Math.max.apply(null, cells.map(a => a[0])) + 1;
  const h = Math.max.apply(null, cells.map(a => a[1])) + 1;
  const s = Math.min(box / w, box / h, 22);
  const ox = cx - (w * s) / 2, oy = cy - (h * s) / 2;
  const col = PIECE_DEF[type].c;
  const sp = blockSprite(col);
  cells.forEach(([x,y]) => {
    c.drawImage(sp, ox + x * s, oy + y * s, s, s);
  });
}
function drawHold(){
  hctx.clearRect(0, 0, 120, 84);
  if(!G.hold){
    hctx.fillStyle = 'rgba(255,255,255,.16)';
    hctx.font = '600 11px "Segoe UI", system-ui, sans-serif';
    hctx.textAlign = 'center';
    hctx.fillText('— EMPTY —', 60, 46);
    return;
  }
  const dim = !G.canHold;
  hctx.save();
  if(dim) hctx.globalAlpha = 0.35;
  drawMini(hctx, G.hold, 60, 42, 74);
  hctx.restore();
  if(FX.holdPulse > 0.02){
    hctx.save();
    hctx.globalCompositeOperation = 'lighter';
    hctx.globalAlpha = FX.holdPulse * 0.5;
    hctx.fillStyle = '#39e0ff';
    hctx.fillRect(0, 0, 120, 84);
    hctx.restore();
  }
}
function drawNext(){
  nctx.clearRect(0, 0, 120, 336);
  const slotH = 336 / 5;
  for(let i = 0; i < 5; i++){
    const t = G.queue[i];
    if(!t) break;
    const y = i * slotH + slotH / 2;
    const scale = i === 0 ? 1 : 0.78;
    nctx.save();
    if(i > 0) nctx.globalAlpha = 0.92 - i * 0.13;
    drawMini(nctx, t, 60, y, 78 * scale);
    nctx.restore();
    if(i === 0){
      nctx.strokeStyle = 'rgba(57,224,255,.35)';
      nctx.lineWidth = 1;
      roundRect(nctx, 4, 3, 112, slotH - 6, 8);
      nctx.stroke();
    }
    if(i < 4){
      nctx.strokeStyle = 'rgba(255,255,255,.07)';
      nctx.beginPath();
      nctx.moveTo(14, (i + 1) * slotH); nctx.lineTo(106, (i + 1) * slotH);
      nctx.stroke();
    }
  }
}

/* --- HUD --- */
const HUD_CACHE = {};
function put(id, val){
  if(HUD_CACHE[id] === val) return;
  HUD_CACHE[id] = val;
  const el = $(id);
  if(el) el.textContent = val;
}
function fmtTime(ms){
  const s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function updateHUD(){
  put('score', fmt(G.score));
  put('best', fmt(Math.max(G.best, G.score)));
  put('lines', String(G.lines));
  put('level', String(G.level));
  put('time', fmtTime(G.time));
  put('combo', G.combo >= 1 ? '×' + G.combo : '—');
  put('b2b', G.b2b ? 'ACTIVE' : '—');
  $('comboBox').classList.toggle('on', G.combo >= 1);
  $('b2bBox').classList.toggle('on', G.b2b);

  const T = TIERS[G.tier];
  if(HUD_CACHE.tier !== G.tier){
    HUD_CACHE.tier = G.tier;
    $('fxName').innerHTML = T.en + '<small>' + T.jp + '</small>';
    const dots = $('tierDots').children;
    for(let i = 0; i < dots.length; i++) dots[i].classList.toggle('on', i <= G.tier);
  }
  const nextIn = (Math.floor(G.lines / 10) + 1) * 10 - G.lines;
  const pct = ((10 - nextIn) / 10) * 100;
  if(HUD_CACHE.pct !== pct){
    HUD_CACHE.pct = pct;
    $('fxBar').firstElementChild.style.width = pct + '%';
  }
}
let statusTimer = 0;
function statusMsg(text){
  statusEl.textContent = text;
  statusEl.classList.add('on');
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => statusEl.classList.remove('on'), 2400);
}
/* =========================================================
 *  SCREEN SIZE / LOOP
 * ========================================================= */
let FW = 0, FH = 0, DPR = 1;
const REDUCED = (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) || false;

function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  FW = window.innerWidth; FH = window.innerHeight;
  fxEl.width = Math.round(FW * DPR); fxEl.height = Math.round(FH * DPR);
  fxEl.style.width = FW + 'px'; fxEl.style.height = FH + 'px';
  fctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // 画面に収まるように全体をスケール
  const pageEl = $('page');
  pageEl.style.transform = 'none';
  const needH = $('title').offsetHeight + gameEl.offsetHeight + $('help').offsetHeight + 36;
  const needW = Math.max($('title').offsetWidth, gameEl.offsetWidth, $('help').offsetWidth) + 20;
  const k = Math.min(1, (FH - 6) / needH, (FW - 6) / needW);
  pageEl.style.transform = k < 0.999 ? 'scale(' + k.toFixed(4) + ')' : 'none';

  // 盤面: 表示サイズに合わせて解像度を合わせる (スケール変換にも対応)
  const r = boardEl.getBoundingClientRect();
  const sx = r.width / W, sy = r.height / H;
  boardEl.width = Math.max(1, Math.round(r.width * DPR));
  boardEl.height = Math.max(1, Math.round(r.height * DPR));
  bctx.setTransform(sx * DPR, 0, 0, sy * DPR, 0, 0);

  // HOLD / NEXT は固定論理サイズ
  [[holdEl, 120, 84, hctx], [nextEl, 120, 336, nctx]].forEach(([el, w, h, ctx]) => {
    el.width = Math.round(w * DPR); el.height = Math.round(h * DPR);
    el.style.width = w + 'px'; el.style.height = h + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  });
}

function applyShake(){
  const k = REDUCED ? 0.25 : 1;
  let a = '', b = '';
  if(FX.shake > 0.5){
    const x = (Math.random() * 2 - 1) * FX.shake * k;
    const y = (Math.random() * 2 - 1) * FX.shake * k;
    a = `translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,0)`;
  }
  if(FX.pageShake > 0.4){
    const x = (Math.random() * 2 - 1) * FX.pageShake * k;
    const y = (Math.random() * 2 - 1) * FX.pageShake * k;
    b = `translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,0)`;
  }
  stageEl.style.transform = a;
  gameEl.style.transform = b;
  flashEl.style.opacity = FX.flashA > 0.01 ? FX.flashA.toFixed(3) : '0';
  flashEl.style.background = FX.flashColor;
  warpEl.style.opacity = FX.warpA > 0.01 ? FX.warpA.toFixed(3) : '0';
  dangerEl.style.opacity = (FX.dangerA * (0.45 + 0.4 * Math.sin(now() / 130))).toFixed(3);
}

/* ---------------- game controls ---------------- */
function startGame(){
  AU.resume();
  newBoard();
  G.score = 0; G.lines = 0; G.level = 1; G.tier = 0;
  G.combo = -1; G.b2b = false; G.time = 0;
  G.hold = null; G.canHold = true; G.queue = []; G.bag = [];
  G.piece = null; G.clearRows = []; G.clearInfo = null; G.clearT = 0;
  G.lockFlash = null; G.overReason = ''; G.danger = false;
  G.paused = false; G.phase = 'play';
  Keys.left.held = Keys.right.held = Keys.down.held = false;
  DirStack.length = 0;
  FX.parts.length = 0; FX.rings.length = 0; FX.beams.length = 0;
  FX.streaks.length = 0; FX.glitches.length = 0; FX.pops.length = 0;
  FX.shake = 0; FX.pageShake = 0; FX.flashA = 0; FX.warpA = 0; FX.chroma = 0;
  HUD_CACHE.tier = undefined; HUD_CACHE.pct = undefined;
  refillQueue();
  spawn();
  hideOverlay();
  Music.setIntensity(0);
  Music.start();
  AU.sfx('start');
  updateHUD();
  statusMsg('READY ── GO!');
}
function restart(){ startGame(); }

function togglePause(){
  if(G.phase === 'menu' || G.phase === 'over') return;
  G.paused = !G.paused;
  if(G.paused){ Music.stop(); AU.sfx('pause'); showOverlay('pause'); }
  else{ hideOverlay(); AU.sfx('resume'); Music.start(); lastT = 0; }
}
function toggleMute(){
  AU.resume();
  AU.setMuted(!AU.muted);
  statusMsg(AU.muted ? 'MUTE' : 'SOUND ON');
}
function rankOf(s){
  if(s >= 120000) return 'S+';
  if(s >= 80000) return 'S';
  if(s >= 50000) return 'A';
  if(s >= 30000) return 'B';
  if(s >= 15000) return 'C';
  return 'D';
}

function showOverlay(kind){
  overlayEl.classList.remove('hidden');
  if(kind === 'menu'){
    overlayEl.innerHTML =
      '<div class="big">爆裂テトリス</div>' +
      '<div class="msg">ライン消去で画面が大爆発。<br>10ライン消すごとにエフェクトが進化します。</div>' +
      '<div class="keys">← → 移動 ／ ↓ ソフトドロップ ／ SPACE ハードドロップ<br>' +
      '↑・X 右回転 ／ Z 左回転 ／ Q 180° ／ C ホールド<br>' +
      'P ポーズ ／ M ミュート ／ R リスタート</div>' +
      '<button class="btn" data-act="start">START</button>' +
      '<div class="msg" style="font-size:11px;opacity:.7">クリック または Enter キー</div>';
  }else if(kind === 'pause'){
    overlayEl.innerHTML =
      '<div class="big">PAUSED</div>' +
      '<div class="msg">P / ESC で再開</div>' +
      '<button class="btn" data-act="resume">RESUME</button>';
  }else if(kind === 'over'){
    const best = Math.max(G.best, G.score);
    overlayEl.innerHTML =
      '<div class="big">GAME OVER</div>' +
      '<div class="rank">' + rankOf(G.score) + '</div>' +
      '<div class="final">SCORE <b>' + fmt(G.score) + '</b></div>' +
      '<div class="msg">' + (G.overReason || 'TOP OUT') + '<br>' +
      'LINES ' + G.lines + ' ／ LEVEL ' + G.level + ' ／ ' + fmtTime(G.time) + '<br>' +
      'BEST ' + fmt(best) + '</div>' +
      '<button class="btn" data-act="start">RETRY</button>' +
      '<div class="msg" style="font-size:11px;opacity:.7">R キーでも再スタート</div>';
  }
  const btn = overlayEl.querySelector('.btn');
  if(btn) btn.addEventListener('click', () => { AU.resume(); startGame(); });
}
function hideOverlay(){ overlayEl.classList.add('hidden'); }

/* ---------------- 主ループ ---------------- */
let lastT = 0;
function doGravity(dt){
  const p = G.piece;
  if(!p) return;
  const base = gravityMs();
  const down = Keys.down.held;
  const interval = down ? Math.min(SDR, base) : base;
  G.gravAcc += dt;
  let guard = 0;
  while(G.gravAcc >= interval && guard++ < 64){
    if(!collide(p.t, p.rot, p.x, p.y + 1)){
      G.gravAcc -= interval;
      p.y++;
      G.grounded = false;
      G.lockT = 0;
      if(down){ G.score += 1; G.gravAcc = Math.min(G.gravAcc, interval); }
    }else{
      if(down && !G.grounded) AU.sfx('land');
      G.grounded = true;
      G.gravAcc = 0;
      break;
    }
  }
}
function doLock(dt){
  const p = G.piece;
  if(!p) return;
  const grounded = collide(p.t, p.rot, p.x, p.y + 1);
  G.grounded = grounded;
  if(!grounded){ G.lockT = 0; return; }
  G.lockT += dt;
  if(G.lockT >= LOCK_MS) lockPiece();
}

function tick(dt, t){
  if(!G.paused){
    if(G.phase === 'play'){
      G.time += dt;
      updateInput(dt);
      doGravity(dt);
      doLock(dt);
    }else if(G.phase === 'clear'){
      G.clearT -= dt;
      if(G.clearT <= 0) finishClear();
    }
    if(G.phase !== 'over') fxUpdate(dt);
  }
  render(t);
}
function render(t){
  drawBoard(t);
  drawFX();
  drawHold();
  drawNext();
  updateHUD();
  applyShake();
}
function frame(t){
  requestAnimationFrame(frame);
  if(!lastT) lastT = t;
  let dt = t - lastT;
  lastT = t;
  if(dt > 100) dt = 100;      // タブ復帰時の巨大デルタを抑制
  if(dt < 0) dt = 0;
  tick(dt, t);
}

/* =========================================================
 *  EVENTS
 * ========================================================= */
window.addEventListener('keydown', e => {
  if(e.repeat) return;
  const c = e.code;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter'].indexOf(c) >= 0
     || c.indexOf('Numpad') === 0) e.preventDefault();
  AU.resume();
  if(!AU.ready || !Music.playing){
    if(G.phase === 'play' && !G.paused && !Music.playing) Music.start();
  }
  onPress(c);
}, {passive:false});

window.addEventListener('keyup', e => onRelease(e.code));
window.addEventListener('resize', () => { resize(); });
window.addEventListener('pointerdown', () => {
  AU.resume();
  if(G.phase === 'play' && !G.paused && !Music.playing) Music.start();
});
document.addEventListener('visibilitychange', () => {
  if(document.hidden && (G.phase === 'play' || G.phase === 'clear') && !G.paused) togglePause();
});

/* =========================================================
 *  INIT
 * ========================================================= */
function init(){
  for(let i = 0; i < TIERS.length; i++) $('tierDots').appendChild(document.createElement('i'));
  newBoard();
  refillQueue();
  resize();
  updateHUD();
  showOverlay('menu');
  requestAnimationFrame(frame);
}
init();

/* デバッグ / 自動テスト用フック */
window.__TETRIS__ = {
  get G(){ return G; },
  get board(){ return board; },
  spawn, move, rotate, hardDrop, holdPiece, lockPiece, applyClear, finishClear,
  startGame, updateHUD, resize,
  tick:(dt) => tick(dt || 16, now()),
  keys:Keys, fx:FX, AU, Music,
};
</script>
