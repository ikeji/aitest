<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>派手テトリス</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #060610;
  color: #fff;
  font-family: 'Courier New', monospace;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
  user-select: none;
}
#wrap {
  display: flex;
  gap: 16px;
  align-items: flex-start;
}
canvas { display: block; image-rendering: pixelated; }
#main { border: 1px solid #222; box-shadow: 0 0 30px rgba(0,160,255,0.2); }
.panel { display: flex; flex-direction: column; gap: 12px; }
.box {
  background: rgba(255,255,255,0.04);
  border: 1px solid #1e1e2e;
  padding: 10px 12px;
  border-radius: 3px;
  min-width: 90px;
}
.lbl { font-size: 10px; color: #555; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; }
.val { font-size: 22px; color: #eee; font-weight: bold; }
#overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.85);
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  z-index: 200;
}
#overlay h1 {
  font-size: 44px; color: #0ef;
  text-shadow: 0 0 24px #0ef, 0 0 60px #08f;
  margin-bottom: 24px;
  letter-spacing: 4px;
}
.keys { color: #666; font-size: 13px; margin: 4px 0; }
#btn {
  margin-top: 20px;
  background: #0ef; color: #000;
  border: none; padding: 12px 36px;
  font-size: 16px; font-weight: bold;
  cursor: pointer; border-radius: 3px;
  letter-spacing: 2px;
}
#btn:hover { background: #0cf; }
#fx-label {
  position: fixed; top: 18px; left: 50%;
  transform: translateX(-50%);
  font-size: 20px; color: #ff0;
  text-shadow: 0 0 12px #ff0;
  pointer-events: none; opacity: 0;
  transition: opacity 0.4s;
  z-index: 100; letter-spacing: 3px;
}
#combo-label {
  position: fixed; top: 56px; left: 50%;
  transform: translateX(-50%);
  font-size: 28px; color: #f80;
  text-shadow: 0 0 16px #f80;
  pointer-events: none; opacity: 0;
  z-index: 100; font-weight: bold;
  transition: opacity 0.3s;
}
</style>
</head>
<body>
<div id="wrap">
  <div class="panel">
    <div class="box">
      <div class="lbl">HOLD</div>
      <canvas id="hold" width="88" height="72"></canvas>
    </div>
    <div class="box">
      <div class="lbl">SCORE</div>
      <div class="val" id="score">0</div>
    </div>
    <div class="box">
      <div class="lbl">LEVEL</div>
      <div class="val" id="level">1</div>
    </div>
    <div class="box">
      <div class="lbl">LINES</div>
      <div class="val" id="lines">0</div>
    </div>
    <div class="box">
      <div class="lbl">COMBO</div>
      <div class="val" id="combo">-</div>
    </div>
  </div>
  <canvas id="main" width="300" height="600"></canvas>
  <div class="panel">
    <div class="box">
      <div class="lbl">NEXT</div>
      <canvas id="next" width="88" height="380"></canvas>
    </div>
  </div>
</div>
<div id="fx-label"></div>
<div id="combo-label"></div>
<div id="overlay">
  <h1>派手テトリス</h1>
  <p class="keys">←→ : 移動 &nbsp; ↑ / X : 右回転</p>
  <p class="keys">Z : 左回転 &nbsp; ↓ : ソフトドロップ</p>
  <p class="keys">Space : ハードドロップ &nbsp; C : ホールド</p>
  <button id="btn">START</button>
</div>

<script>
// ═══════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════
const COLS = 10, ROWS = 20, CS = 30; // cell size

// Colors
const PC = {
  I:'#00e5ff', O:'#ffe000', T:'#bb00ff',
  S:'#00e676', Z:'#ff1744', J:'#2979ff', L:'#ff9100'
};

// SRS cells [rotation 0..3] — coords are [col, row] relative to piece origin
const PD = {
  I:[[[0,1],[1,1],[2,1],[3,1]],[[2,0],[2,1],[2,2],[2,3]],[[0,2],[1,2],[2,2],[3,2]],[[1,0],[1,1],[1,2],[1,3]]],
  O:[[[1,0],[2,0],[1,1],[2,1]],[[1,0],[2,0],[1,1],[2,1]],[[1,0],[2,0],[1,1],[2,1]],[[1,0],[2,0],[1,1],[2,1]]],
  T:[[[1,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[2,1],[1,2]],[[1,0],[0,1],[1,1],[1,2]]],
  S:[[[1,0],[2,0],[0,1],[1,1]],[[1,0],[1,1],[2,1],[2,2]],[[1,1],[2,1],[0,2],[1,2]],[[0,0],[0,1],[1,1],[1,2]]],
  Z:[[[0,0],[1,0],[1,1],[2,1]],[[2,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[1,2],[2,2]],[[1,0],[0,1],[1,1],[0,2]]],
  J:[[[0,0],[0,1],[1,1],[2,1]],[[1,0],[2,0],[1,1],[1,2]],[[0,1],[1,1],[2,1],[2,2]],[[1,0],[1,1],[0,2],[1,2]]],
  L:[[[2,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[1,2],[2,2]],[[0,1],[1,1],[2,1],[0,2]],[[0,0],[1,0],[1,1],[1,2]]]
};

// SRS wall kicks — JLSTZ: [from_rotation] → list of (dx,dy) in board coords
const WK = [
  [[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]], // 0→1
  [[0,0],[1,0],[1,-1],[0,2],[1,2]],      // 1→2
  [[0,0],[1,0],[1,1],[0,-2],[1,-2]],     // 2→3
  [[0,0],[-1,0],[-1,-1],[0,2],[-1,2]]   // 3→0
];
// SRS wall kicks — I
const WKI = [
  [[0,0],[-2,0],[1,0],[-2,-1],[1,2]],   // 0→1
  [[0,0],[-1,0],[2,0],[-1,2],[2,-1]],   // 1→2
  [[0,0],[2,0],[-1,0],[2,1],[-1,-2]],   // 2→3
  [[0,0],[1,0],[-2,0],[1,-2],[-2,1]]    // 3→0
];

// ═══════════════════════════════════════════
// 7-BAG RANDOMIZER
// ═══════════════════════════════════════════
class Bag {
  constructor() { this.q = []; }
  next() {
    if (!this.q.length) {
      this.q = Object.keys(PD);
      for (let i = this.q.length - 1; i > 0; i--) {
        const j = Math.random() * (i+1) | 0;
        [this.q[i],this.q[j]] = [this.q[j],this.q[i]];
      }
    }
    return this.q.pop();
  }
}

// ═══════════════════════════════════════════
// AUDIO ENGINE  (Web Audio API synthesis)
// ═══════════════════════════════════════════
class Audio {
  constructor() {
    this.ac = null;
    this.mGain = null;
    this.bgmGain = null;
    this.sfxGain = null;
    this.bgmTimer = null;
    this.playing = false;
    this.tempo = 136; // BPM
  }

  init() {
    if (this.ac) return;
    this.ac = new (window.AudioContext || window.webkitAudioContext)();
    this.mGain = this.ac.createGain(); this.mGain.gain.value = 0.5;
    this.mGain.connect(this.ac.destination);
    this.bgmGain = this.ac.createGain(); this.bgmGain.gain.value = 0.25;
    this.bgmGain.connect(this.mGain);
    this.sfxGain = this.ac.createGain(); this.sfxGain.gain.value = 0.6;
    this.sfxGain.connect(this.mGain);
  }

  _osc(freq, t, dur, type='square', vol=0.3, dst=null) {
    if (!this.ac) return;
    const o = this.ac.createOscillator();
    const g = this.ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dst || this.sfxGain);
    o.start(t); o.stop(t + dur + 0.01);
  }

  sfxMove()   { const t=this.ac.currentTime; this._osc(220,t,0.04,'square',0.08); }
  sfxRotate() { const t=this.ac.currentTime; this._osc(380,t,0.05,'square',0.12); this._osc(560,t+0.03,0.04,'square',0.08); }
  sfxDrop()   { const t=this.ac.currentTime; this._osc(130,t,0.08,'square',0.3); this._osc(90,t+0.04,0.1,'square',0.2); }
  sfxLock()   { const t=this.ac.currentTime; this._osc(70,t,0.12,'square',0.35); }
  sfxHold()   { const t=this.ac.currentTime; this._osc(300,t,0.06,'square',0.15); this._osc(240,t+0.05,0.06,'square',0.1); }

  sfxClear(n, tspin) {
    const t = this.ac.currentTime;
    const scale = [262,330,392,523,659,784,1047];
    for (let i = 0; i < n; i++) this._osc(scale[i+2]*2, t+i*0.06, 0.18, 'square', 0.35);
    if (tspin) {
      [523,659,784,1047].forEach((f,i)=>this._osc(f,t+i*0.07,0.15,'sawtooth',0.3));
    }
    if (n === 4) {
      [1047,1319,1568,2093].forEach((f,i)=>this._osc(f,t+i*0.05,0.12,'sawtooth',0.25));
    }
  }

  sfxLevelUp() {
    const t = this.ac.currentTime;
    [262,330,392,523,659,784,1047].forEach((f,i)=>this._osc(f,t+i*0.06,0.18,'square',0.3));
  }

  sfxCombo(n) {
    const t = this.ac.currentTime;
    const f = 262 * Math.pow(2, Math.min(n,8)/12);
    this._osc(f,t,0.1,'sawtooth',0.25);
    this._osc(f*1.5,t+0.08,0.1,'sawtooth',0.2);
  }

  setTempo(level) { this.tempo = Math.min(220, 110 + level * 10); }

  startBGM() {
    if (!this.ac || this.playing) return;
    this.playing = true;
    this._loop();
  }

  stopBGM() {
    this.playing = false;
    if (this.bgmTimer) { clearTimeout(this.bgmTimer); this.bgmTimer = null; }
  }

  _loop() {
    if (!this.playing) return;
    const b = 60 / this.tempo; // beat duration
    const t = this.ac.currentTime + 0.05;

    // Korobeiniki-inspired melody
    const M = [
      [659,1],[494,.5],[523,.5],[587,1],[523,.5],[494,.5],
      [440,1],[440,.5],[523,.5],[659,1],[587,.5],[523,.5],
      [494,1.5],[523,.5],[587,1],[659,1],
      [523,1],[440,1],[440,2],
      [0,.5],
      [587,1],[698,.5],[880,1],[784,.5],[698,.5],
      [659,1.5],[523,.5],[659,1],[587,.5],[523,.5],
      [494,1],[494,.5],[523,.5],[587,1],[659,1],
      [523,1],[440,1],[440,2],[0,.5]
    ];
    // Bass
    const B = [
      [110,2],[131,2],[147,2],[110,2],
      [110,2],[131,2],[147,2],[164,2],
      [130,2],[147,2],[110,2],[110,2],
      [110,2],[131,2],[147,2],[164,2],
    ];

    let mt = t;
    M.forEach(([f,d])=>{
      if(f>0) this._osc(f,mt,d*b*0.88,'square',0.18,this.bgmGain);
      mt += d*b;
    });
    let bt = t;
    B.forEach(([f,d])=>{
      this._osc(f,bt,d*b*0.75,'sawtooth',0.15,this.bgmGain);
      bt += d*b;
    });

    const dur = M.reduce((s,[,d])=>s+d,0)*b;
    this.bgmTimer = setTimeout(()=>this._loop(), (dur-0.1)*1000);
  }
}

// ═══════════════════════════════════════════
// EFFECTS ENGINE
// ═══════════════════════════════════════════
class Effects {
  constructor() {
    this.particles = [];
    this.shakeX = 0; this.shakeY = 0;
    this.shakeEnd = 0; this.shakeAmp = 0;
    this.flashA = 0; this.flashC = '#fff';
    this.type = 0;
  }

  setType(lines) { this.type = Math.floor(lines/10) % 6; }

  shake(amp, ms) { this.shakeAmp = amp; this.shakeEnd = Date.now() + ms; }
  flash(c, a) { this.flashC = c; this.flashA = a; }

  spawnClear(clearedRows, nLines) {
    const W = COLS*CS, colors = ['#ff8800','#00ff88','#ff0088','#00ffff','#ffff00','#ff44ff'];
    this.flash(colors[this.type], Math.min(0.7, 0.3 + nLines*0.1));
    this.shake(nLines*5, 200+nLines*80);

    clearedRows.forEach(row => {
      const cy = row*CS + CS/2;
      switch(this.type) {
        case 0: // Explosion sparks
          for(let i=0;i<50;i++){
            const a=Math.PI*2*Math.random(), s=2+Math.random()*8;
            this._add({x:Math.random()*W,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,
              life:1,decay:.018+Math.random()*.015,size:2+Math.random()*5,
              color:`hsl(${Math.random()*60+10},100%,65%)`,type:'sq',grav:0.15});
          }
          break;
        case 1: // Matrix rain
          for(let x=0;x<W;x+=10){
            for(let n=0;n<12;n++){
              this._add({x:x+Math.random()*10,y:cy-Math.random()*200,vx:0,vy:4+Math.random()*9,
                life:1,decay:.008+Math.random()*.015,size:11,
                char:String.fromCharCode(0x30A0+Math.random()*96|0),
                color:`hsl(120,100%,${40+Math.random()*40}%)`,type:'char',grav:0});
            }
          }
          break;
        case 2: // Rainbow burst
          for(let i=0;i<70;i++){
            const a=Math.PI*2*i/70, s=2+Math.random()*9;
            this._add({x:W/2,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
              life:1,decay:.012+Math.random()*.015,size:3+Math.random()*7,
              color:`hsl(${i*5.1},100%,65%)`,type:'circle',grav:0.1});
          }
          break;
        case 3: // Lightning bolts
          for(let i=0;i<25;i++){
            this._add({x:Math.random()*W,y:0,vx:(Math.random()-.5)*3,vy:7+Math.random()*6,
              life:1,decay:.04+Math.random()*.02,size:2,
              color:`hsl(${200+Math.random()*60},100%,80%)`,type:'bolt',grav:0,
              segments:[],tx:Math.random()*W,ty:cy});
          }
          break;
        case 4: // Starfield
          for(let i=0;i<90;i++){
            const a=Math.PI*2*i/90,r=Math.random();
            this._add({x:W/2,y:cy,vx:Math.cos(a)*(2+r*12),vy:Math.sin(a)*(2+r*12),
              life:1,decay:.008+Math.random()*.018,size:1+Math.random()*4,
              color:`hsl(${Math.random()*360},100%,80%)`,type:'star',grav:0,rot:0});
          }
          break;
        case 5: // Block shatter
          for(let col=0;col<COLS;col++){
            this._add({x:col*CS+CS/2,y:cy,vx:(Math.random()-.5)*14,
              vy:-4-Math.random()*10,life:1,decay:.013,size:CS-4,
              color:`hsl(${Math.random()*360},75%,60%)`,type:'sq',grav:.5});
          }
          break;
      }
    });
  }

  _add(p) { this.particles.push(p); }

  update() {
    const now = Date.now();
    if(now < this.shakeEnd){
      const r=(this.shakeEnd-now)/400;
      this.shakeX=(Math.random()-.5)*this.shakeAmp*r;
      this.shakeY=(Math.random()-.5)*this.shakeAmp*r;
    } else { this.shakeX=this.shakeY=0; }
    this.flashA=Math.max(0,this.flashA-.025);

    this.particles = this.particles.filter(p=>{
      p.life -= p.decay; p.x += p.vx; p.y += p.vy;
      if(p.grav) p.vy += p.grav;
      if(p.type==='sq') p.vx *= 0.94;
      if(p.rot !== undefined) p.rot += 0.15;
      return p.life > 0 && p.y < ROWS*CS+100;
    });
  }

  draw(ctx, W, H) {
    if(this.flashA > 0){
      ctx.save(); ctx.globalAlpha=this.flashA;
      ctx.fillStyle=this.flashC; ctx.fillRect(0,0,W,H);
      ctx.restore();
    }
    this.particles.forEach(p=>{
      ctx.save(); ctx.globalAlpha=p.life;
      ctx.fillStyle=p.color; ctx.strokeStyle=p.color;
      switch(p.type){
        case 'sq':
          ctx.shadowBlur=10; ctx.shadowColor=p.color;
          ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size); break;
        case 'char':
          ctx.font=`bold ${p.size}px monospace`;
          ctx.shadowBlur=12; ctx.shadowColor=p.color;
          ctx.fillText(p.char,p.x,p.y); break;
        case 'circle':
          ctx.shadowBlur=14; ctx.shadowColor=p.color;
          ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill(); break;
        case 'bolt':
          ctx.lineWidth=1.5; ctx.shadowBlur=18; ctx.shadowColor=p.color;
          ctx.beginPath(); ctx.moveTo(p.x,p.y);
          ctx.lineTo(p.x+p.vx*4+(Math.random()-.5)*10,p.y+p.vy*4);
          ctx.stroke(); break;
        case 'star':
          ctx.shadowBlur=12; ctx.shadowColor=p.color;
          ctx.translate(p.x,p.y); ctx.rotate(p.rot);
          for(let i=0;i<4;i++){
            ctx.rotate(Math.PI/2);
            ctx.fillRect(-p.size/2,-1,p.size,2);
          }
          break;
      }
      ctx.restore();
    });
  }
}

// ═══════════════════════════════════════════
// GAME ENGINE
// ═══════════════════════════════════════════
const FX_NAMES = ['EXPLOSION','MATRIX','RAINBOW','LIGHTNING','STARFIELD','SHATTER'];

class Game {
  constructor() {
    this.cvs  = document.getElementById('main');
    this.ctx  = this.cvs.getContext('2d');
    this.hcvs = document.getElementById('hold');
    this.hctx = this.hcvs.getContext('2d');
    this.ncvs = document.getElementById('next');
    this.nctx = this.ncvs.getContext('2d');

    this.audio = new Audio();
    this.fx    = new Effects();
    this.bag   = new Bag();

    this.board = [];
    this.piece = null;
    this.holdType = null;
    this.holdLocked = false;
    this.nextQ = [];
    this.score = 0; this.level = 1; this.lines = 0; this.combo = -1;
    this.running = false; this.gameOver = false;
    this.lastT = 0; this.dropT = 0; this.lockT = 0; this.lockMoves = 0;
    this.onGround = false;
    this.keys = {}; this.dasDir = 0; this.dasT = 0; this.arrT = 0;

    this._bindKeys();
  }

  _bindKeys() {
    addEventListener('keydown', e => {
      if (this.keys[e.code]) return;
      this.keys[e.code] = true;
      this._onKey(e.code);
      e.preventDefault();
    });
    addEventListener('keyup', e => {
      this.keys[e.code] = false;
      if (e.code==='ArrowLeft'||e.code==='ArrowRight') {
        this.dasDir=0; this.dasT=0; this.arrT=0;
      }
    });
  }

  _onKey(code) {
    if (!this.running) return;
    switch(code) {
      case 'ArrowLeft':  this._mv(-1,0); this.dasDir=-1; this.dasT=0; break;
      case 'ArrowRight': this._mv(1,0);  this.dasDir=1;  this.dasT=0; break;
      case 'ArrowUp': case 'KeyX': this._rot(1); break;
      case 'KeyZ': case 'ControlLeft': case 'ControlRight': this._rot(-1); break;
      case 'ArrowDown': break; // handled in _update
      case 'Space': this._hardDrop(); break;
      case 'KeyC': case 'ShiftLeft': case 'ShiftRight': this._hold(); break;
    }
  }

  _mv(dx, dy) {
    const nx=this.piece.x+dx, ny=this.piece.y+dy;
    if(!this._hit(this.piece.cells,nx,ny)){
      this.piece.x=nx; this.piece.y=ny;
      if(dx!==0) { this.audio.sfxMove(); this._resetLock(); }
      return true;
    }
    return false;
  }

  _resetLock() {
    if(this.onGround && this.lockMoves < 15){ this.lockT=0; this.lockMoves++; }
  }

  _rot(dir) {
    const type=this.piece.type;
    const nextR=(this.piece.r+dir+4)%4;
    const cells=PD[type][nextR];
    const kicks=type==='I'?WKI:WK;
    const ki=dir===1?this.piece.r:nextR;
    for(const[kx,ky] of kicks[ki]){
      const nx=this.piece.x+(dir===1?kx:-kx);
      const ny=this.piece.y+(dir===1?ky:-ky);
      if(!this._hit(cells,nx,ny)){
        this.piece.x=nx; this.piece.y=ny;
        this.piece.r=nextR; this.piece.cells=cells;
        this.audio.sfxRotate();
        this._resetLock();
        return;
      }
    }
  }

  _hardDrop() {
    let dropped=0;
    while(!this._hit(this.piece.cells,this.piece.x,this.piece.y+1)){
      this.piece.y++; dropped++;
    }
    this.score += dropped*2;
    this.audio.sfxDrop();
    this._lock();
  }

  _hold() {
    if(this.holdLocked) return;
    this.audio.sfxHold();
    if(this.holdType){
      const tmp=this.holdType;
      this.holdType=this.piece.type;
      this._spawn(tmp);
    } else {
      this.holdType=this.piece.type;
      this._next();
    }
    this.holdLocked=true;
  }

  _hit(cells, px, py) {
    for(const[cx,cy] of cells){
      const nx=px+cx, ny=py+cy;
      if(nx<0||nx>=COLS||ny>=ROWS) return true;
      if(ny>=0&&this.board[ny][nx]) return true;
    }
    return false;
  }

  _ghostY() {
    let y=this.piece.y;
    while(!this._hit(this.piece.cells,this.piece.x,y+1)) y++;
    return y;
  }

  _isTspin() {
    if(this.piece.type!=='T') return false;
    const {x,y}=this.piece;
    const corners=[[0,0],[2,0],[0,2],[2,2]];
    let n=0;
    for(const[cx,cy] of corners){
      const nx=x+cx,ny=y+cy;
      if(nx<0||nx>=COLS||ny<0||ny>=ROWS||this.board[ny]?.[nx]) n++;
    }
    return n>=3;
  }

  _lock() {
    const {cells,x,y,type}=this.piece;
    const tspin=this._isTspin();
    for(const[cx,cy] of cells){
      if(y+cy<0){this._gameOver();return;}
      this.board[y+cy][x+cx]=PC[type];
    }
    this.audio.sfxLock();
    this._clearLines(tspin);
    this.holdLocked=false;
    this._next();
  }

  _clearLines(tspin) {
    const rows=[];
    for(let r=ROWS-1;r>=0;r--){
      if(this.board[r].every(c=>c)) rows.push(r);
    }
    if(!rows.length){ this.combo=-1; this._ui(); return; }

    rows.forEach(r=>{ this.board.splice(r,1); this.board.unshift(new Array(COLS).fill(null)); });

    const n=rows.length;
    this.combo++;
    const BASE=[0,100,300,500,800];
    let pts=(BASE[n]||800)*this.level*(tspin?2:1);
    if(this.combo>0) { pts+=50*this.combo*this.level; this.audio.sfxCombo(this.combo); }
    this.score+=pts;
    this.lines+=n;

    const newLevel=Math.floor(this.lines/10)+1;
    if(newLevel>this.level){ this.level=newLevel; this.audio.setTempo(this.level); this.audio.playSFX_levelup?.(); this.audio.sfxLevelUp(); this._showFxLabel(); }
    this.level=newLevel;

    this.fx.setType(this.lines);
    this.fx.spawnClear(rows,n);
    this.audio.sfxClear(n,tspin);
    this._showCombo(n,tspin);
    this._ui();
  }

  _showFxLabel() {
    const el=document.getElementById('fx-label');
    el.textContent='EFFECT: '+FX_NAMES[Math.floor(this.lines/10)%6];
    el.style.opacity=1;
    clearTimeout(this._fxT);
    this._fxT=setTimeout(()=>el.style.opacity=0,2200);
  }

  _showCombo(n, tspin) {
    const el=document.getElementById('combo-label');
    let txt='';
    if(n===4) txt='TETRIS!!';
    else if(tspin&&n>0) txt='T-SPIN!';
    else if(this.combo>=2) txt='COMBO x'+(this.combo+1);
    if(!txt) return;
    el.textContent=txt; el.style.opacity=1;
    clearTimeout(this._cbT);
    this._cbT=setTimeout(()=>el.style.opacity=0,1500);
  }

  _next() {
    while(this.nextQ.length<5) this.nextQ.push(this.bag.next());
    this._spawn(this.nextQ.shift());
  }

  _spawn(type) {
    const cells=PD[type][0];
    this.piece={type,cells,r:0,x:3,y:type==='I'?-1:0};
    if(this._hit(cells,this.piece.x,this.piece.y)){this._gameOver();return;}
    this.onGround=false; this.lockT=0; this.lockMoves=0;
  }

  _gameOver() {
    this.running=false; this.gameOver=true;
    this.audio.stopBGM();
    const ov=document.getElementById('overlay');
    ov.querySelector('h1').textContent='GAME OVER';
    ov.querySelectorAll('.keys')[0].textContent='Score: '+this.score.toLocaleString();
    ov.querySelectorAll('.keys')[1].textContent='Lines: '+this.lines+' / Level: '+this.level;
    document.getElementById('btn').textContent='RETRY';
    ov.style.display='flex';
  }

  _ui() {
    document.getElementById('score').textContent=this.score.toLocaleString();
    document.getElementById('level').textContent=this.level;
    document.getElementById('lines').textContent=this.lines;
    document.getElementById('combo').textContent=this.combo>=0?'x'+(this.combo+1):'-';
  }

  start() {
    this.board=Array.from({length:ROWS},()=>new Array(COLS).fill(null));
    this.score=0; this.level=1; this.lines=0; this.combo=-1;
    this.holdType=null; this.holdLocked=false; this.nextQ=[];
    this.bag=new Bag(); this.fx=new Effects();
    this.gameOver=false; this.running=true;
    this.audio.init(); this.audio.setTempo(1); this.audio.startBGM();
    this._next(); this._ui();
    this.lastT=performance.now();
    requestAnimationFrame(t=>this._frame(t));
  }

  _frame(t) {
    if(!this.running) return;
    this._update(t-this.lastT); this.lastT=t;
    this._draw();
    requestAnimationFrame(t=>this._frame(t));
  }

  _update(dt) {
    if(dt>200) dt=200;
    // DAS / ARR
    if(this.dasDir&&(this.keys['ArrowLeft']||this.keys['ArrowRight'])){
      this.dasT+=dt;
      if(this.dasT>=167){ this.arrT+=dt; if(this.arrT>=33){this._mv(this.dasDir,0);this.arrT=0;} }
    }
    // Gravity
    const sdrop=this.keys['ArrowDown'];
    const interval=sdrop?50:Math.max(80,1000-(this.level-1)*80);
    this.dropT+=dt;
    if(this.dropT>=interval){
      this.dropT=0;
      if(!this._mv(0,1)){ this.onGround=true; }
      else if(sdrop) this.score++;
    }
    // Check ground
    this.onGround=this._hit(this.piece.cells,this.piece.x,this.piece.y+1);
    // Lock delay
    if(this.onGround){
      this.lockT+=dt;
      if(this.lockT>=500) this._lock();
    } else { this.lockT=0; }
    this.fx.update();
  }

  _draw() {
    const c=this.ctx, W=COLS*CS, H=ROWS*CS;
    c.save();
    c.translate(this.fx.shakeX, this.fx.shakeY);
    // Background
    c.fillStyle='#06060f'; c.fillRect(0,0,W,H);
    // Grid lines
    c.strokeStyle='rgba(255,255,255,0.03)'; c.lineWidth=.5;
    for(let x=0;x<=COLS;x++){c.beginPath();c.moveTo(x*CS,0);c.lineTo(x*CS,H);c.stroke();}
    for(let y=0;y<=ROWS;y++){c.beginPath();c.moveTo(0,y*CS);c.lineTo(W,y*CS);c.stroke();}
    // Board
    for(let r=0;r<ROWS;r++) for(let col=0;col<COLS;col++)
      if(this.board[r][col]) this._cell(c,col*CS,r*CS,this.board[r][col]);
    // Ghost
    if(this.piece){
      const gy=this._ghostY();
      c.globalAlpha=0.2;
      for(const[cx,cy] of this.piece.cells)
        this._cell(c,(this.piece.x+cx)*CS,(gy+cy)*CS,PC[this.piece.type]);
      c.globalAlpha=1;
      // Active piece
      for(const[cx,cy] of this.piece.cells){
        const py=this.piece.y+cy;
        if(py>=0) this._cell(c,(this.piece.x+cx)*CS,py*CS,PC[this.piece.type]);
      }
    }
    c.restore();
    this.fx.draw(c,W,H);
    this._drawHold(); this._drawNext();
  }

  _cell(ctx,x,y,color,s=CS) {
    ctx.fillStyle=color;
    ctx.fillRect(x+1,y+1,s-2,s-2);
    ctx.fillStyle='rgba(255,255,255,0.28)';
    ctx.fillRect(x+1,y+1,s-2,3);
    ctx.fillRect(x+1,y+1,3,s-2);
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.fillRect(x+1,y+s-4,s-2,3);
    ctx.fillRect(x+s-4,y+1,3,s-2);
  }

  _mini(ctx, type, W, H) {
    if(!type) return;
    const cells=PD[type][0], color=PC[type], s=18;
    const xs=cells.map(([cx])=>cx), ys=cells.map(([,cy])=>cy);
    const pw=(Math.max(...xs)-Math.min(...xs)+1)*s;
    const ph=(Math.max(...ys)-Math.min(...ys)+1)*s;
    const ox=(W-pw)/2-Math.min(...xs)*s;
    const oy=(H-ph)/2-Math.min(...ys)*s;
    cells.forEach(([cx,cy])=>this._cell(ctx,ox+cx*s,oy+cy*s,color,s));
  }

  _drawHold() {
    const c=this.hctx, W=88, H=72;
    c.fillStyle='#06060f'; c.fillRect(0,0,W,H);
    if(this.holdLocked) c.globalAlpha=0.3;
    this._mini(c,this.holdType,W,H);
    c.globalAlpha=1;
  }

  _drawNext() {
    const c=this.nctx, W=88;
    c.fillStyle='#06060f'; c.fillRect(0,0,W,380);
    for(let i=0;i<Math.min(5,this.nextQ.length);i++){
      c.save(); c.translate(0,i*76);
      this._mini(c,this.nextQ[i],W,76);
      c.restore();
    }
  }
}

// ═══════════════════════════════════════════
// BOOTSTRAP
// ═══════════════════════════════════════════
const game = new Game();
document.getElementById('btn').addEventListener('click',()=>{
  document.getElementById('overlay').style.display='none';
  game.start();
});
</script>
