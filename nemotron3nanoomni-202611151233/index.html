<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tetris</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #000;
      overflow: hidden;
      transition: background-color 0.5s;
    }
    #game {
      border: 2px solid #fff;
      background-color: #000;
    }
  </style>
</head>
<body>
  <canvas id="game" width="400" height="600"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/tetris@1.0.0/tetris.min.js"></script>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const game = {
      board: [],
      currentPiece: null,
      position: { x: 0, y: 0 },
      score: 0,
      linesCleared: 0,
      effectType: 0
    };

    function initBoard() {
      game.board = Array(20).fill().map(() => Array(10).fill(0));
    }

    function drawBoard() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let y = 0; y < 20; y++) {
        for (let x = 0; x < 10; x++) {
          if (game.board[y][x] !== 0) {
            ctx.fillStyle = 'rgba(0, 255, 0, 0.5)';
            ctx.fillRect(x * 40, y * 40, 40, 40);
          }
        }
      }
    }

    function checkLines() {
      let lines = 0;
      for (let y = 0; y < 20; y++) {
        if (game.board[y].every(cell => cell !== 0)) {
          lines++;
          game.board.splice(y, 1);
          game.board.unshift(Array(10).fill(0));
          y--;
        }
      }
      if (lines > 0) {
        game.linesCleared += lines;
        if (game.linesCleared % 10 === 0) {
          game.effectType = (game.effectType + 1) % 3;
        }
        document.body.style.backgroundColor = ['red', 'blue', 'green'][game.effectType];
        setTimeout(() => {
          document.body.style.backgroundColor = '#000';
        }, 500);
        playSound('clear');
      }
    }

    function playSound(type) {
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      oscillator.type = 'sine';
      switch(type) {
        case 'clear':
          oscillator.frequency.value = 440;
          break;
        case 't-spin':
          oscillator.frequency.value = 880;
          break;
        case 'tetris':
          oscillator.frequency.value = 660;
          break;
      }
      gainNode.gain.setValueAtTime(0.5, audioContext.currentTime);
      oscillator.start();
      oscillator.stop(audioContext.currentTime + 0.5);
    }

    function gameLoop() {
      drawBoard();
      requestAnimationFrame(gameLoop);
    }

    initBoard();
    gameLoop();

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') {
        // Move left
      } else if (e.key === 'ArrowRight') {
        // Move right
      } else if (e.key === 'ArrowUp') {
        // Rotate
      }
    });
  </script>
</body>
</html>
