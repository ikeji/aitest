<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>派手エフェクト・テトリス</title>
<style>
html, body { margin: 0; height: 100%; background: #0a0c12; color: #e8eaf2; font-family: "Segoe UI", system-ui, sans-serif; }
#root { display: flex; gap: 20px; padding: 16px; height: 100vh; box-sizing: border-box; }
#board_wrap { display: flex; align-items: flex-start; }
#board { display: block; }
#side { display: flex; flex-direction: column; gap: 8px; min-width: 200px; justify-content: center; }
.stat { display: flex; gap: 8px; align-items: baseline; font-size: 13px; color: #9aa0b4; }
.stat b { font-family: "Cascadia Mono", monospace; font-size: 15px; color: #e8eaf2; }
.section { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: #6b7180; }
.canvas-wrap canvas { display: block; background: #141a26; border: 1px solid #2a3042; border-radius: 6px; }
#hud { font-size: 12px; min-height: 46px; line-height: 1.5; color: #9aa0b4; }
#hud span.gameover { color: #ff6b81; font-weight: 600; }
#restart { padding: 8px 14px; font-size: 13px; border: none; border-radius: 6px; background: #2b4ffc; color: #fff; cursor: pointer; }
#restart:hover { background: #4b6fff; }
.keys { font-size: 11px; line-height: 1.7; color: #6b7180; }
.keys b { color: #c8ccda; }
</style>
</head>
<body>
<div id="root">
  <div id="board_wrap"><canvas id="board"></canvas></div>
  <div id="side">
    <div class="stat"><span>Score:</span><b id="score">0</b></div>
    <div class="stat"><span>Lines:</span><b id="lines">0</b></div>
    <div class="stat"><span>Level:</span><b id="level">0</b></div>
    <div class="section">NEXT</div>
    <div><canvas id="next_canvas"></canvas></div>
    <div class="section" style="margin-top: 8px;">HOLD</div>
    <div><canvas id="hold_canvas"></canvas></div>
    <div id="hud"></div>
    <button id="restart" type="button">Restart</button>
    <div class="keys">A/D ← →: 移動 · ↑/W: 回転 · Z: 反回転 · S/↓: 落下 · X/空白: 即時落下 · Shift: 保持 · P: 一時停止 · R: リスタート</div>
  </div>
</div>
<script id="game_script">
/* ─── 定数 ─── */
const BOARD_W = 10, BOARD_H = 20;
const CELL = 26, PAD = 6;
const MINI_CELL = 8;
const SPAWN_X = 3, SPAWN_Y = 0;
const LOCK_DELAY = 450;

const COLORS = {
  I: '#00E0FF', O: '#FFEB00', T: '#A050FF', S: '#39D98A',
  Z: '#FF5B5B', J: '#4F7CFF', L: '#FFA62E',
};

const KICKS_DEFAULT = [[0, 0], [-1, 0], [1, 0], [0, -1], [0, 1]];

/* ─── ピース定義 ─── */
function rotateCW(p, c) {
  return [Math.round(c[0] - (p[1] - c[1])), Math.round(c[1] + (p[0] - c[0]))];
}
function buildStates(def) {
  if (def.states) return def.states;
  const n = def.nStates || 4;
  const states = [def.cells0];
  const cx = def.cells0.reduce((s, p) => s + p[0], 0) / def.cells0.length;
  const cy = def.cells0.reduce((s, p) => s + p[1], 0) / def.cells0.length;
  const c = [Math.round(cx), Math.round(cy)];
  for (let i = 1; i < n; i++) states.push(states[i - 1].map(p => rotateCW(p, c)));
  return states;
}

const PIECE_DEFS = {
  O: { id: 'O', color: COLORS.O, cells0: [[0, 0], [1, 0], [0, 1], [1, 1]], nStates: 1 },
  I: { id: 'I', color: COLORS.I, states: [
    [[0, 0], [1, 0], [2, 0], [3, 0]],
    [[1, 0], [1, 1], [1, 2], [1, 3]],
    [[0, 0], [1, 0], [2, 0], [3, 0]],
    [[1, 0], [1, 1], [1, 2], [1, 3]],
  ]},
  T: { id: 'T', color: COLORS.T, cells0: [[0, 0], [1, 0], [2, 0], [1, 1]], nStates: 4 },
  J: { id: 'J', color: COLORS.J, cells0: [[0, 0], [0, 1], [0, 2], [1, 2]], nStates: 4 },
  L: { id: 'L', color: COLORS.L, cells0: [[0, 0], [0, 1], [0, 2], [-1, 2]], nStates: 4 },
  S: { id: 'S', color: COLORS.S, cells0: [[1, 0], [2, 0], [0, 1], [1, 1]], nStates: 4 },
  Z: { id: 'Z', color: COLORS.Z, cells0: [[0, 0], [1, 0], [1, 1], [2, 1]], nStates: 4 },
};
for (const id of Object.keys(PIECE_DEFS)) PIECE_DEFS[id].states = buildStates(PIECE_DEFS[id]);
/* ─── ゲーム状態 ─── */
const game = {
  state: 'idle', paused: false,
  grid: [], piece: null, hold: null,
  nextQueue: [], nextIdx: 0,
  score: 0, lines: 0, level: 0, lastTens: 0,
  shake: { t: 0, amp: 0, dx: 0, dy: 0 },
  particles: [], overlays: [], moveLog: [],
  lastDrop: 0,
};
let effectIdx = 0;

function newGrid() {
  return Array.from({ length: BOARD_H }, () => new Array(BOARD_W).fill(null));
}
function pieceCells(piece) {
  return piece.states[piece.state].map(p => [piece.x + p[0], piece.y + p[1]]);
}
function pieceInGrid(piece, x, y, state) {
  return piece.states[state].every(([cx, cy]) => {
    const px = x + cx, py = y + cy;
    if (px < 0 || px >= BOARD_W) return false;
    if (py >= BOARD_H) return false;
    if (py < -4) return false;
    if (py >= 0) return game.grid[py][px] == null;
    return true;
  });
}
function tryMove(piece, dx, dy) {
  if (pieceInGrid(piece, piece.x + dx, piece.y + dy, piece.state)) {
    piece.x += dx; piece.y += dy;
    piece.lockAt = performance.now();
    game.moveLog.push({ type: 'move' });
    game.moveLog = game.moveLog.slice(-6);
    return true;
  }
  return false;
}
function rotate(piece, dir) {
  const n = piece.states.length;
  const ns = (piece.state + dir + n) % n;
  for (const [kx, ky] of KICKS_DEFAULT) {
    if (pieceInGrid(piece, piece.x + kx, piece.y + ky, ns)) {
      piece.x += kx; piece.y += ky; piece.state = ns;
      piece.lockAt = performance.now();
      game.moveLog.push({ type: 'rot' });
      game.moveLog = game.moveLog.slice(-6);
      sfxRotate();
      return true;
    }
  }
  return false;
}
function shufflePieces() {
  const arr = Object.keys(PIECE_DEFS);
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function spawnPiece() {
  const def = PIECE_DEFS[takePiece()];
  const piece = { id: def.id, color: def.color, states: def.states, state: 0, x: SPAWN_X, y: SPAWN_Y, lockAt: performance.now() };
  if (!pieceInGrid(piece, piece.x, piece.y, piece.state)) {
    game.state = 'over';
    return null;
  }
  game.piece = piece;
  game.lastDrop = performance.now();
  return piece;
}
function takePiece() {
  if (game.nextIdx >= game.nextQueue.length) {
    game.nextQueue = shufflePieces();
    game.nextIdx = 0;
  }
  return game.nextQueue[game.nextIdx++];
}
function hardDrop() {
  const piece = game.piece;
  if (!piece) return;
  while (tryMove(piece, 0, 1)) {}
  sfxHardDrop();
  lockPiece();
}
function softDrop() {
  const piece = game.piece;
  if (!piece) return;
  if (tryMove(piece, 0, 1)) { sfxSoftDrop(); }
  else if (performance.now() - piece.lockAt >= LOCK_DELAY) { lockPiece(); }
}
function doHold() {
  const piece = game.piece;
  if (!piece) return;
  if (game.hold == null) {
    game.hold = piece;
    game.piece = null;
    spawnPiece();
  } else {
    game.piece = game.hold;
    game.hold = piece;
  }
}
/* ─── 消去とロック ─── */
function applyClear(rows) {
  const cleared = new Set(rows);
  const kept = [];
  for (let y = 0; y < BOARD_H; y++) if (!cleared.has(y)) kept.push(game.grid[y]);
  game.grid = kept.concat(Array.from({ length: BOARD_H - kept.length }, () => new Array(BOARD_W).fill(null)));
}
function detectTSpin(piece) {
  if (piece.id !== 'T') return 0;
  const hist = game.moveLog.slice(-2);
  const hasRot = hist.some(m => m.type === 'rot');
  const hasMove = hist.some(m => m.type === 'move');
  if (!(hasRot && hasMove)) return 0;
  const cells = pieceCells(piece);
  let surrounded = 0;
  for (const [cx, cy] of cells) {
    let ok = true;
    for (const [dx, dy] of [[0, -1], [0, 1], [-1, 0], [1, 0]]) {
      const nx = cx + dx, ny = cy + dy;
      const inPiece = cells.some(([px, py]) => px === nx && py === ny);
      const inGrid = !inPiece && ny >= 0 && ny < BOARD_H && nx >= 0 && nx < BOARD_W && game.grid[ny][nx] != null;
      if (!inPiece && !inGrid) { ok = false; break; }
    }
    if (ok) surrounded++;
  }
  if (surrounded >= 3) return 1;
  if (surrounded >= 1 && surrounded <= 2) return 2;
  return 0;
}
function lockPiece() {
  const piece = game.piece;
  if (!piece) return;
  const cells = pieceCells(piece);
  for (const [cx, cy] of cells) {
    if (cy >= 0 && cy < BOARD_H) game.grid[cy][cx] = piece.color;
  }
  const fullRows = [];
  for (let y = 0; y < BOARD_H; y++) if (game.grid[y].every(c => c != null)) fullRows.push(y);
  const tspin = fullRows.length ? detectTSpin(piece) : 0;
  let clearedColors = [];
  if (fullRows.length) {
    clearedColors = fullRows.flatMap(y => game.grid[y].map((c, x) => [x, y, c]));
    applyClear(fullRows);
  }
  if (fullRows.length) {
    const n = fullRows.length;
    const base = n === 1 ? 100 : n === 2 ? 300 : n === 3 ? 500 : 800;
    game.score += base * (game.level + 1);
    if (tspin) {
      game.score += tspin === 1 ? 400 : 100;
      sfxTSpin();
    }
    if (n === 4) sfxTetris();
    game.lines += n;
    const tens = Math.floor(game.lines / 10);
    if (tens !== game.lastTens) {
      game.lastTens = tens;
      if (tens > 0) effectIdx = (effectIdx + 1) % EFFECTS.length;
    }
    spawnEffect(EFFECTS[effectIdx], clearedColors);
    sfxClear(n);
  } else {
    sfxLock();
  }
  const cur = piece;
  game.piece = null;
  if (game.hold == null) {
    game.hold = cur;
    spawnPiece();
  } else {
    game.piece = game.hold;
    game.hold = cur;
    if (game.piece) game.piece.lockAt = performance.now();
  }
  game.lastDrop = performance.now();
  updateStats();
}
function dropDelay() {
  return Math.max(60, 960 - game.level * 85);
}
/* ─── メインループ / 入力 / 初期化 ─── */
function tick() {
  if (game.state !== 'playing' || game.paused) { updateHud(); return; }
  const now = performance.now();
  const piece = game.piece;
  if (piece) {
    if (now - game.lastDrop >= dropDelay()) {
      game.lastDrop = now;
      if (!tryMove(piece, 0, 1) && now - piece.lockAt >= LOCK_DELAY) {
        lockPiece();
      }
    }
    updateStats();
  }
  updateHud();
}
function onKeyDown(e) {
  const key = e.key;
  if (game.state === 'idle') {
    e.preventDefault();
    startGame();
    Audio.resume();
    return;
  }
  if (game.state === 'over') {
    if (key === 'r' || key === 'R') { e.preventDefault(); startGame(); Audio.resume(); }
    return;
  }
  if (game.paused) {
    if (key === 'p' || key === 'P') { e.preventDefault(); game.paused = false; }
    return;
  }
  if (game.state !== 'playing') return;
  const piece = game.piece;
  if (!piece) return;
  switch (key) {
    case 'ArrowLeft': case 'a': case 'A': case 'h': case 'H':
      if (tryMove(piece, -1, 0)) sfxMove();
      e.preventDefault(); break;
    case 'ArrowRight': case 'd': case 'D': case 'l': case 'L':
      if (tryMove(piece, 1, 0)) sfxMove();
      e.preventDefault(); break;
    case 'ArrowUp': case 'w': case 'W': case 'k': case 'K':
      rotate(piece, 1);
      e.preventDefault(); break;
    case 'z': case 'Z':
      rotate(piece, -1);
      e.preventDefault(); break;
    case 's': case 'S': case 'ArrowDown':
      softDrop();
      e.preventDefault(); break;
    case 'x': case 'X': case ' ':
      hardDrop();
      e.preventDefault(); break;
    case 'Shift':
      doHold();
      e.preventDefault(); break;
    case 'p': case 'P':
      game.paused = true;
      e.preventDefault(); break;
    case 'r': case 'R':
      startGame();
      e.preventDefault(); break;
  }
}
function updateStats() {
  if (scoreEl) scoreEl.textContent = String(game.score);
  if (linesEl) linesEl.textContent = String(game.lines);
  if (levelEl) levelEl.textContent = String(game.level);
}
function updateHud() {
  if (game.state === 'idle') {
    hudEl.textContent = '派手エフェクト・テトリス — 何かキーを押してスタート (A/D: 左右, ↑/Z: 回転, S: 落下, X: 即時落下, Shift: 保持)';
  } else if (game.state === 'over') {
    hudEl.innerHTML = '<span class="gameover">Game Over！</span> スコア: ' + game.score + ' — R キーまたは Restart ボタンで再開';
  } else if (game.paused) {
    hudEl.textContent = '一時停止中 — P キーで再開';
  } else {
    hudEl.textContent = '';
  }
}
function startGame() {
  Audio.start();
  Audio.startBgm();
  game.state = 'playing';
  game.paused = false;
  game.grid = newGrid();
  game.piece = null; game.hold = null;
  game.score = 0; game.lines = 0; game.level = 0; game.lastTens = 0;
  game.moveLog = [];
  game.nextQueue = shufflePieces(); game.nextIdx = 0;
  effectIdx = 0;
  game.particles = []; game.overlays = [];
  spawnPiece();
  updateStats();
  updateHud();
}
/* ─── エフェクトシステム ─── */
const EFFECTS = ['burst', 'shatter', 'rain', 'storm', 'ripple', 'glitch'];
const CONFETTI = ['#FFD700', '#FF5B5B', '#39D98A', '#4F7CFF', '#A050FF', '#00E0FF', '#FFA62E', '#FFEB00'];

function rnd() { return Math.random(); }

function spawnParticle(p) {
  game.particles.push(Object.assign({
    x: 0, y: 0, vx: 0, vy: 0, r: 3, a: 1, da: 0.03, color: '#fff',
  }, p));
}

function spawnOverlay(o) {
  game.overlays.push(Object.assign({ life: 1, a: 1, decay: 0.98, rot: 0, growth: 0 }, o));
}

function business() {
  return Math.min(2.4, 1 + game.lines / 70);
}

function shake(amp) {
  game.shake = { t: 0.35, amp, dx: 0, dy: 0 };
}

function updateShake() {
  if (game.shake.t > 0) {
    game.shake.dx = (rnd() - 0.5) * 2 * game.shake.amp;
    game.shake.dy = (rnd() - 0.5) * 2 * game.shake.amp;
    game.shake.t -= 0.016;
  } else {
    game.shake.dx = game.shake.dy = 0;
  }
}

function spawnEffect(type, cells) {
  const b = business();
  const px = x => PAD + (x + 0.5) * CELL;
  const py = y => PAD + (y + 0.5) * CELL;
  switch (type) {
    case 'burst':
      for (const [x, y, color] of cells) {
        for (let i = 0; i < 9 * b; i++) {
          const ang = rnd() * Math.PI * 2;
          const sp = 2.5 + rnd() * 5;
          spawnParticle({ x: px(x), y: py(y), vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 1.5, r: 2 + rnd() * 3, color, da: 0.04 });
        }
      }
      shake(0.15 * b);
      playEffectSound('burst');
      break;
    case 'shatter':
      for (const [x, y, color] of cells) {
        for (let i = 0; i < 16 * b; i++) {
          spawnParticle({ x: px(x), y: py(y), vx: (rnd() - 0.5) * 5, vy: (rnd() - 0.5) * 3 + 4, r: 1.5 + rnd() * 2.5, color, da: 0.05 + rnd() * 0.03 });
        }
      }
      shake(0.1 * b);
      playEffectSound('shatter');
      break;
    case 'rain':
      for (let i = 0; i < 70 * b; i++) {
        spawnParticle({
          x: rnd() * BOARD_W * CELL, y: -rnd() * 40,
          vx: (rnd() - 0.5) * 2, vy: 1 + rnd() * 0.8,
          r: 1 + rnd() * 2, a: 0.85, da: 0.03,
          color: CONFETTI[Math.floor(rnd() * CONFETTI.length)],
        });
      }
      shake(0.03);
      playEffectSound('rain');
      break;
    case 'storm':
      for (let i = 0; i < 40 * b; i++) {
        spawnOverlay({
          type: 'hex',
          x: (rnd() < 0.5 ? -CELL : BOARD_W * CELL) + rnd() * CELL,
          y: rnd() * BOARD_H * CELL,
          vx: -3 - rnd() * 4, vy: (rnd() - 0.5) * 5,
          rot: rnd() * 6, size: 6 + rnd() * 10, a: 0.3 + rnd() * 0.4,
          life: 6, color: CONFETTI[Math.floor(rnd() * CONFETTI.length)],
        });
      }
      shake(0.02);
      playEffectSound('storm');
      break;
    case 'ripple': {
      const cx = PAD + BOARD_W * CELL / 2, cy = PAD + BOARD_H * CELL / 2;
      for (let i = 0; i < 6; i++) {
        spawnOverlay({ type: 'ring', x: cx, y: cy, r: rnd() * 40, growth: 4 + rnd() * 6, a: 0.3, life: 5, color: '#00E0FF', decay: 0.99 });
      }
      shake(0.04);
      playEffectSound('ripple');
      break;
    }
    case 'glitch':
      spawnOverlay({ type: 'flash', a: 0.8, life: 0.15, decay: 0.98 });
      shake(0.05);
      playEffectSound('glitch');
      break;
  }
}

function updateEffects() {
  const dt = 0.016;
  for (let i = game.overlays.length - 1; i >= 0; i--) {
    const o = game.overlays[i];
    o.x += o.vx || 0; o.y += o.vy || 0;
    if (o.type === 'ring') o.r += (o.growth || 0) * dt * 60;
    o.life -= dt;
    o.a *= Math.pow(o.decay || 0.98, dt * 60);
    if (o.life <= 0 || o.a < 0.02) game.overlays.splice(i, 1);
  }
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const p = game.particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.16;
    p.a -= p.da; p.r *= 0.98;
    if (p.a <= 0.04) game.particles.splice(i, 1);
  }
  if (game.particles.length > 900) game.particles = game.particles.slice(-900);
}

/* ─── 音声合成 ─── */
const BGM_BASS = [87.31, 98.0, 65.41, 87.31];
const BGM_TH = [220, 247.94, 262.63, 293.66];
const BGM_MEL = [392, 349.23, 330, 293.66, 262.63, 247.94, 220, 196];

const Audio = {
  ctx: null,
  noiseBuf: null,
  bgmStarted: false,
  start() {
    if (!Audio.ctx) Audio.ctx = new AudioContext();
    if (Audio.ctx.state === 'suspended') Audio.ctx.resume();
  },
  beep(freq, dur, opts = {}) {
    const ctx = Audio.ctx;
    if (!ctx) return;
    const now = opts.at ?? ctx.currentTime;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = opts.type ?? 'sine';
    o.frequency.value = freq;
    const vol = opts.vol ?? 0.12;
    const attack = opts.attack ?? 0.003;
    g.gain.setValueAtTime(0, now);
    g.gain.exponentialRampToValueAtTime(Math.max(0.02, vol), now + attack);
    if (opts.decay) {
      g.gain.exponentialRampToValueAtTime(0.002, now + dur * 0.5);
      g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    } else {
      g.gain.setValueAtTime(vol, now + attack);
      g.gain.exponentialRampToValueAtTime(0.01, now + Math.max(dur * 0.25, 0.02));
      g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    }
    o.start(now);
    o.stop(now + dur);
    o.connect(g);
    g.connect(ctx.destination);
  },
  noise(dur, freq, vol, at) {
    const ctx = Audio.ctx;
    if (!ctx) return;
    if (!Audio.noiseBuf) {
      const buf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      Audio.noiseBuf = buf;
    }
    const now = at ?? ctx.currentTime;
    const src = ctx.createBufferSource();
    src.buffer = Audio.noiseBuf;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = freq;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, now);
    g.gain.exponentialRampToValueAtTime(vol, now + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    src.start(now);
    src.stop(now + dur);
    src.connect(lp);
    lp.connect(g);
    g.connect(ctx.destination);
  },
  startBgm() {
    if (Audio.bgmStarted || !Audio.ctx) return;
    Audio.bgmStarted = true;
    Audio.scheduleBgm();
  },
  scheduleBgm() {
    const ctx = Audio.ctx;
    const Q = 60 / 140;
    const notes = [];
    for (let beat = 0; beat < 16; beat++) {
      const bt = ctx.currentTime + beat * Q;
      notes.push({ at: bt, dur: 0.5, freq: BGM_BASS[beat % BGM_BASS.length], vol: 0.10, type: 'sine' });
      if (beat % 2 === 0) notes.push({ at: bt + Q / 2, dur: Q / 2, freq: BGM_MEL[(beat / 2) % BGM_MEL.length], vol: 0.13, type: 'square' });
      if (beat % 4 === 0) notes.push({ at: bt, dur: 1, freq: BGM_TH[(beat / 4) % BGM_TH.length], vol: 0.15, type: 'square' });
    }
    notes.forEach(n => Audio.beep(n.freq, n.dur, { type: n.type, vol: n.vol, at: n.at }));
    setTimeout(() => Audio.scheduleBgm(), 1000 * (16 * Q + 1));
  },
};

function sfxMove() { Audio.beep(2200, 0.07, { type: 'sine', vol: 0.08 }); }
function sfxRotate() { Audio.beep(2800, 0.05, { type: 'sine', vol: 0.06 }); }
function sfxSoftDrop() { Audio.beep(3600, 0.04, { type: 'sine', vol: 0.05 }); }
function sfxHardDrop() { Audio.beep(120, 0.4, { type: 'sine', vol: 0.25, decay: true }); }
function sfxLock() { Audio.noise(0.15, 120, 0.18); }
function sfxClear(n) {
  const now = Audio.ctx.currentTime;
  for (let i = 0; i < n; i++) Audio.beep(800 + i * 130, 0.1, { type: 'sine', vol: 0.11, at: now + i * 0.06 });
}
function sfxTSpin() {
  const now = Audio.ctx.currentTime;
  Audio.beep(2600, 0.14, { type: 'triangle', vol: 0.25, at: now });
  Audio.beep(3300, 0.08, { type: 'triangle', vol: 0.2, at: now + 0.03 });
}
function sfxTetris() {
  const now = Audio.ctx.currentTime;
  Audio.beep(140, 0.8, { type: 'sine', vol: 0.3, decay: true, at: now });
  for (let i = 0; i < 6; i++) Audio.beep(350 + i * 60, 0.12, { type: 'sine', vol: 0.16, at: now + 0.15 + i * 0.07 });
  Audio.noise(0.3, 110, 0.22, now + 0.1);
}

const EFFECT_SOUNDS = {
  burst: () => {
    const now = Audio.ctx.currentTime;
    Audio.beep(90, 0.3, { type: 'sine', vol: 0.18, decay: true, at: now });
    Audio.noise(0.12, 900, 0.2, now + 0.02);
  },
  shatter: () => {
    const now = Audio.ctx.currentTime;
    for (let i = 0; i < 4; i++) Audio.beep(1000 + i * 60, 0.1, { type: 'sine', vol: 0.12, at: now + i * 0.04 });
  },
  rain: () => {
    const now = Audio.ctx.currentTime;
    for (let i = 0; i < 12; i++) Audio.beep(900 + i * 160, 0.3, { type: 'sine', vol: 0.1, at: now + i * 0.05 });
  },
  storm: () => {
    const now = Audio.ctx.currentTime;
    for (let i = 0; i < 8; i++) Audio.beep(2200 - i * 120, 0.2, { type: 'sine', vol: 0.1, at: now + i * 0.25 });
  },
  ripple: () => Audio.beep(55, 0.5, { type: 'sine', vol: 0.2, decay: true }),
  glitch: () => Audio.noise(0.3, 1200, 0.35),
};
function playEffectSound(type) {
  const fn = EFFECT_SOUNDS[type];
  if (fn) fn();
}

/* ─── 描画 ─── */
let boardCtx, nextCtx, holdCtx;
let scoreEl, linesEl, levelEl, hudEl, restartBtn;

function drawCell(ctx, x, y, color) {
  ctx.fillStyle = color;
  ctx.fillRect(PAD + x * CELL + 1, PAD + y * CELL + 1, CELL - 2, CELL - 2);
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.25)';
  ctx.lineWidth = 1;
  ctx.strokeRect(PAD + x * CELL, PAD + y * CELL, CELL, CELL);
}

function drawBoard() {
  const ctx = boardCtx;
  const W2 = BOARD_W * CELL + 12, H2 = BOARD_H * CELL + 12;
  ctx.save();
  ctx.translate(game.shake.dx, game.shake.dy);
  ctx.clearRect(0, 0, W2, H2);
  ctx.fillStyle = '#141a26';
  ctx.fillRect(0, 0, W2, H2);
  ctx.strokeStyle = '#2a3042';
  ctx.strokeRect(0, 0, W2, H2);
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for (let y = 1; y < BOARD_H; y++) {
    ctx.beginPath();
    ctx.moveTo(PAD, PAD + y * CELL);
    ctx.lineTo(PAD + BOARD_W * CELL, PAD + y * CELL);
    ctx.stroke();
  }
  for (let x = 1; x < BOARD_W; x++) {
    ctx.beginPath();
    ctx.moveTo(PAD + x * CELL, PAD);
    ctx.lineTo(PAD + x * CELL, PAD + BOARD_H * CELL);
    ctx.stroke();
  }
  for (let y = 0; y < BOARD_H; y++) {
    const row = game.grid[y];
    for (let x = 0; x < BOARD_W; x++) if (row[x]) drawCell(ctx, x, y, row[x]);
  }
  if (game.piece && game.piece.color) {
    ctx.globalAlpha = 0.2;
    for (const [cx, cy] of pieceCells(game.piece)) if (cy >= 0) drawCell(ctx, cx, cy, game.piece.color);
    ctx.globalAlpha = 1;
    for (const [cx, cy] of pieceCells(game.piece)) if (cy >= 0) drawCell(ctx, cx, cy, game.piece.color);
  }
  drawEffects(ctx, W2, H2);
  ctx.restore();
  updateStats();
  drawNextQueue();
  drawHoldPiece();
}

function drawMini(ctx, states, state, color, ox) {
  for (const [cx, cy] of states[state]) {
    if (cy < 0) continue;
    ctx.fillStyle = color;
    ctx.fillRect(ox + cx * MINI_CELL + 1, cy * MINI_CELL + 1, MINI_CELL - 2, MINI_CELL - 2);
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.strokeRect(ox + cx * MINI_CELL, cy * MINI_CELL, MINI_CELL, MINI_CELL);
  }
}
function drawNextQueue() {
  nextCtx.clearRect(0, 0, nextCtx.canvas.width, nextCtx.canvas.height);
  for (let i = 0; i < 5; i++) {
    const id = game.nextQueue[game.nextIdx + i];
    if (!id) break;
    const def = PIECE_DEFS[id];
    drawMini(nextCtx, def.states, 0, def.color, i * (4 * MINI_CELL + 2));
  }
}
function drawHoldPiece() {
  holdCtx.clearRect(0, 0, holdCtx.canvas.width, holdCtx.canvas.height);
  if (!game.hold) return;
  drawMini(holdCtx, game.hold.states, game.hold.state, game.hold.color, 0);
}

function drawEffects(ctx, W2, H2) {
  for (const p of game.particles) {
    ctx.globalAlpha = p.a;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
  }
  ctx.globalAlpha = 1;
  for (const o of game.overlays) {
    ctx.globalAlpha = o.a;
    if (o.type === 'ring') {
      ctx.strokeStyle = o.color;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
      ctx.stroke();
    } else if (o.type === 'hex') {
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.rotate(o.rot || 0);
      ctx.fillStyle = o.color;
      const r = o.size;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = i * Math.PI / 3;
        ctx.lineTo(r * Math.cos(a), r * Math.sin(a));
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    } else if (o.type === 'flash') {
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, W2, H2);
    }
  }
  ctx.globalAlpha = 1;
}

function renderLoop() {
  updateShake();
  updateEffects();
  drawBoard();
  requestAnimationFrame(renderLoop);
}

function init() {
  const board = document.getElementById('board');
  const nextCanvas = document.getElementById('next_canvas');
  const holdCanvas = document.getElementById('hold_canvas');
  boardCtx = board.getContext('2d');
  nextCtx = nextCanvas.getContext('2d');
  holdCtx = holdCanvas.getContext('2d');
  scoreEl = document.getElementById('score');
  linesEl = document.getElementById('lines');
  levelEl = document.getElementById('level');
  hudEl = document.getElementById('hud');
  restartBtn = document.getElementById('restart');
  restartBtn.addEventListener('click', startGame);
  board.width = BOARD_W * CELL + 12;
  board.height = BOARD_H * CELL + 12;
  nextCanvas.width = 5 * (4 * MINI_CELL + 2);
  nextCanvas.height = 4 * MINI_CELL + 2;
  holdCanvas.width = 4 * MINI_CELL + 2;
  holdCanvas.height = 4 * MINI_CELL + 2;
  document.addEventListener('keydown', onKeyDown);
  document.addEventListener('mousedown', () => Audio.resume());
  requestAnimationFrame(renderLoop);
  setInterval(tick, 100);
  startGame();
}
window.addEventListener('load', init);
</script>
