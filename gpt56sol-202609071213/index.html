<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#070912">
  <title>BLASTRIS — 爆発するテトリス</title>
  <style>
    :root{--bg:#05060c;--panel:#0b0f1c;--ink:#f3f7ff;--muted:#758198;--cyan:#53e8ff;--pink:#ff477e;--cell:min(3.7vh,5.25vw);--glow:rgba(83,232,255,.32)}
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
    body{min-height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#101a31 0,#070912 38%,#030408 76%)}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.32;background:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:32px 32px;mask-image:radial-gradient(circle,#000,transparent 76%)}
    button{font:inherit;color:inherit}.app{position:relative;display:grid;grid-template-columns:calc(var(--cell)*3.7) calc(var(--cell)*10) calc(var(--cell)*3.7);gap:clamp(10px,2.1vw,28px);align-items:start;z-index:2}
    .brand{grid-column:1/-1;display:flex;align-items:end;justify-content:space-between;margin-bottom:4px;padding:0 2px}
    .logo{font-size:clamp(1.15rem,3.2vw,2rem);font-weight:950;letter-spacing:.14em;line-height:.8;text-shadow:0 0 24px var(--glow)}
    .logo b{color:var(--cyan)} .logo small{display:block;color:var(--muted);font-size:.48em;letter-spacing:.34em;margin-top:10px;font-weight:650}
    .top-actions{display:flex;gap:7px}.icon-btn{border:1px solid #26314a;background:#0d1322b8;border-radius:10px;width:38px;height:38px;cursor:pointer;display:grid;place-items:center;transition:.18s}.icon-btn:hover{border-color:var(--cyan);color:var(--cyan);transform:translateY(-1px)}
    .side{display:flex;flex-direction:column;gap:10px}.card{background:linear-gradient(145deg,rgba(17,24,42,.9),rgba(8,11,21,.88));border:1px solid #202940;border-radius:14px;padding:12px;box-shadow:0 16px 50px rgba(0,0,0,.18)}
    .label{color:#71809a;font-size:.66rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;margin-bottom:8px}.mini{width:100%;aspect-ratio:1.25;display:block}.stat{padding:10px 0;border-bottom:1px solid #1c2538}.stat:last-child{border:0;padding-bottom:2px}.stat span{display:block;color:#71809a;font-size:.63rem;font-weight:750;letter-spacing:.16em}.stat strong{display:block;font-size:clamp(1.1rem,2.8vw,1.55rem);font-variant-numeric:tabular-nums;margin-top:2px}.stat strong.accent{color:var(--cyan);text-shadow:0 0 12px var(--glow)}
    .board-wrap{position:relative;border-radius:9px;padding:5px;background:linear-gradient(135deg,#58edff,#333bff 35%,#ff3e85 78%,#ffc857);box-shadow:0 0 28px var(--glow),0 32px 80px #0009;overflow:hidden}
    .board-wrap::before{content:"";position:absolute;inset:-50%;background:conic-gradient(transparent,#fff8,transparent 22%);animation:spin 5s linear infinite;opacity:.2}@keyframes spin{to{transform:rotate(360deg)}}
    #game{position:relative;display:block;width:calc(var(--cell)*10);height:calc(var(--cell)*20);background:#070a12;image-rendering:pixelated;border-radius:5px}
    #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}.flash{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;background:#fff;mix-blend-mode:screen}.flash.go{animation:flash .32s ease-out}@keyframes flash{0%{opacity:.58}100%{opacity:0}}
    .next-list{display:grid;gap:2px}.next-list canvas{width:100%;aspect-ratio:2.2;display:block;border-top:1px solid #182137}.next-list canvas:first-child{border-top:0}
    .meter{height:5px;border-radius:9px;background:#1b2232;overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink));box-shadow:0 0 10px var(--cyan);transition:width .35s}
    .effect-name{color:#dbe7ff;font-weight:800;font-size:.79rem;letter-spacing:.05em}.controls{font-size:.69rem;color:#8d9ab0;line-height:1.75}.key{display:inline-grid;place-items:center;min-width:21px;height:20px;border:1px solid #33405b;border-bottom-width:2px;border-radius:5px;color:#dce7fa;font-size:.66rem;margin-right:3px}
    .toast{position:fixed;z-index:8;left:50%;top:48%;transform:translate(-50%,-50%) scale(.7);text-align:center;pointer-events:none;font-weight:1000;font-style:italic;font-size:clamp(2.1rem,8vw,5.4rem);letter-spacing:-.06em;opacity:0;text-shadow:0 0 18px currentColor,3px 4px 0 #08101c}.toast.go{animation:toast .9s cubic-bezier(.12,.85,.25,1)}.toast small{display:block;font-size:.2em;letter-spacing:.3em;color:white}@keyframes toast{0%{opacity:0;transform:translate(-50%,-40%) scale(.3) rotate(-8deg)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.08) rotate(-2deg)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-75%) scale(1.25)}}
    .overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(2,4,10,.74);backdrop-filter:blur(12px);transition:.25s}.overlay.hidden{opacity:0;pointer-events:none}.modal{text-align:center;width:min(90vw,430px);padding:34px;border:1px solid #2a3855;border-radius:24px;background:linear-gradient(150deg,#121a2bd9,#080b14ef);box-shadow:0 35px 110px #000,0 0 50px #4ae7ff24}.modal h1{margin:0;font-size:clamp(2.2rem,10vw,4.4rem);font-style:italic;letter-spacing:-.08em;line-height:.86}.modal h1 span{color:var(--cyan);text-shadow:0 0 25px #53e8ff88}.modal p{color:#9aa7bc;line-height:1.7;margin:20px auto;max-width:33ch}.start{border:0;border-radius:12px;padding:14px 34px;background:linear-gradient(100deg,var(--cyan),#6b72ff 52%,var(--pink));color:#050711;font-weight:950;letter-spacing:.12em;cursor:pointer;box-shadow:0 8px 30px #53e8ff45;transition:.18s}.start:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 12px 38px #53e8ff65}.hint{font-size:.7rem;color:#657087;margin-top:16px}
    .mobile{display:none;position:fixed;inset:auto 0 max(10px,env(safe-area-inset-bottom));z-index:7;padding:0 12px;justify-content:space-between;pointer-events:none}.mobile .cluster{display:flex;gap:8px;align-items:end}.touch{pointer-events:auto;width:52px;height:52px;border:1px solid #52627e66;border-radius:50%;background:#121a2cbc;backdrop-filter:blur(8px);font-weight:900;font-size:1.2rem;touch-action:none}.touch.wide{width:64px;border-radius:18px}.touch:active{background:#2d4269}.mobile .down{transform:translateY(8px)}
    @media(max-width:720px){:root{--cell:min(4.25vh,7.65vw)}body{place-items:start center;padding-top:max(10px,env(safe-area-inset-top))}.app{grid-template-columns:calc(var(--cell)*2.65) calc(var(--cell)*10) calc(var(--cell)*2.65);gap:7px}.brand{margin-bottom:0}.side{gap:6px}.card{padding:7px;border-radius:9px}.label{font-size:.52rem;margin-bottom:3px}.stat{padding:6px 0}.stat span{font-size:.5rem}.stat strong{font-size:.86rem}.controls{display:none}.next-list canvas:nth-child(n+4){display:none}.effect-name{font-size:.58rem}.icon-btn{width:33px;height:33px}.mobile{display:flex}.logo small{display:none}}
    @media(max-height:690px){:root{--cell:3.75vh}.brand{position:absolute;right:0;bottom:0;transform:translateY(115%)}.logo small{display:none}.mobile{display:none}}
    @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}.board-wrap::before{display:none}}
  </style>
</head>
<body>
  <canvas id="fx"></canvas><div class="flash" id="flash"></div><div class="toast" id="toast"></div>
  <main class="app" aria-label="BLASTRIS game">
    <header class="brand"><div class="logo"><b>BLAS</b>TRIS<small>CHAIN REACTION</small></div><div class="top-actions"><button class="icon-btn" id="sound" aria-label="サウンドを切り替え">♪</button><button class="icon-btn" id="pause" aria-label="一時停止">Ⅱ</button></div></header>
    <aside class="side">
      <section class="card"><div class="label">Hold</div><canvas class="mini" id="hold"></canvas></section>
      <section class="card">
        <div class="stat"><span>Score</span><strong class="accent" id="score">0</strong></div>
        <div class="stat"><span>Lines</span><strong id="lines">0</strong></div>
        <div class="stat"><span>Level</span><strong id="level">1</strong></div>
      </section>
      <section class="card controls"><div class="label">Controls</div><div><i class="key">←→</i> 移動</div><div><i class="key">↓</i> ソフトドロップ</div><div><i class="key">Z</i><i class="key">X</i> 回転</div><div><i class="key">Space</i> ハードドロップ</div><div><i class="key">C</i> ホールド</div></section>
    </aside>
    <div class="board-wrap" id="boardWrap"><canvas id="game" width="300" height="600" aria-label="ゲーム盤面"></canvas></div>
    <aside class="side">
      <section class="card"><div class="label">Next</div><div class="next-list"><canvas></canvas><canvas></canvas><canvas></canvas><canvas></canvas><canvas></canvas></div></section>
      <section class="card"><div class="label">Blast phase</div><div class="effect-name" id="effect">SPARK RUSH</div><div class="meter"><i id="meter"></i></div></section>
      <section class="card"><div class="label">Chain</div><div class="stat"><span>Combo</span><strong id="combo">—</strong></div><div class="stat"><span>Back-to-back</span><strong id="b2b">—</strong></div></section>
    </aside>
  </main>
  <div class="mobile" aria-label="タッチ操作"><div class="cluster"><button class="touch" data-act="left">←</button><button class="touch down" data-act="down">↓</button><button class="touch" data-act="right">→</button></div><div class="cluster"><button class="touch" data-act="hold">H</button><button class="touch wide" data-act="ccw">↶</button><button class="touch wide" data-act="cw">↷</button><button class="touch" data-act="drop">⇩</button></div></div>
  <div class="overlay" id="overlay"><section class="modal"><h1><span>BLAS</span>TRIS</h1><p id="message">ラインを揃えて、画面ごと吹き飛ばせ。<br>10ラインごとに爆発フェーズが進化する。</p><button class="start" id="start">BLAST OFF</button><div class="hint">キーボード / タッチ対応 · 音が出ます</div></section></div>
<script>
(()=>{'use strict';
const COLS=10,ROWS=22,HIDDEN=2,B=30, COLORS={I:'#39dcff',J:'#4877ff',L:'#ff9d32',O:'#ffe14c',S:'#58ef80',T:'#b35cff',Z:'#ff4d68'}, NAMES=['SPARK RUSH','PRISM RINGS','VOLT STORM','CONFETTI NOVA','HYPER CHAOS'];
const SHAPES={
 I:[[[0,1],[1,1],[2,1],[3,1]],[[2,0],[2,1],[2,2],[2,3]],[[0,2],[1,2],[2,2],[3,2]],[[1,0],[1,1],[1,2],[1,3]]],
 J:[[[0,0],[0,1],[1,1],[2,1]],[[1,0],[2,0],[1,1],[1,2]],[[0,1],[1,1],[2,1],[2,2]],[[1,0],[1,1],[0,2],[1,2]]],
 L:[[[2,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[1,2],[2,2]],[[0,1],[1,1],[2,1],[0,2]],[[0,0],[1,0],[1,1],[1,2]]],
 O:[[[1,0],[2,0],[1,1],[2,1]],[[1,0],[2,0],[1,1],[2,1]],[[1,0],[2,0],[1,1],[2,1]],[[1,0],[2,0],[1,1],[2,1]]],
 S:[[[1,0],[2,0],[0,1],[1,1]],[[1,0],[1,1],[2,1],[2,2]],[[1,1],[2,1],[0,2],[1,2]],[[0,0],[0,1],[1,1],[1,2]]],
 T:[[[1,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[2,1],[1,2]],[[1,0],[0,1],[1,1],[1,2]]],
 Z:[[[0,0],[1,0],[1,1],[2,1]],[[2,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[1,2],[2,2]],[[1,0],[0,1],[1,1],[0,2]]]
};
const KICKS={normal:{'0>1':[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],'1>0':[[0,0],[1,0],[1,-1],[0,2],[1,2]],'1>2':[[0,0],[1,0],[1,-1],[0,2],[1,2]],'2>1':[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],'2>3':[[0,0],[1,0],[1,1],[0,-2],[1,-2]],'3>2':[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],'3>0':[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],'0>3':[[0,0],[1,0],[1,1],[0,-2],[1,-2]]},I:{'0>1':[[0,0],[-2,0],[1,0],[-2,-1],[1,2]],'1>0':[[0,0],[2,0],[-1,0],[2,1],[-1,-2]],'1>2':[[0,0],[-1,0],[2,0],[-1,2],[2,-1]],'2>1':[[0,0],[1,0],[-2,0],[1,-2],[-2,1]],'2>3':[[0,0],[2,0],[-1,0],[2,1],[-1,-2]],'3>2':[[0,0],[-2,0],[1,0],[-2,-1],[1,2]],'3>0':[[0,0],[1,0],[-2,0],[1,-2],[-2,1]],'0>3':[[0,0],[-1,0],[2,0],[-1,2],[2,-1]]}};
const game=document.querySelector('#game'),g=game.getContext('2d'), fx=document.querySelector('#fx'),f=fx.getContext('2d'), holdC=document.querySelector('#hold'),nextCs=[...document.querySelectorAll('.next-list canvas')];
let board,piece,queue,held,canHold,score,lines,level,combo,b2b,running=false,paused=false,over=false,last=0,dropAcc=0,lockAt=0,lockMoves=0,lastAction='',particles=[],rings=[],bolts=[],shake=0,keys={},repeat={},audioOn=true,audio,master,musicTimer=0,musicStep=0;
function fit(){const d=devicePixelRatio||1;fx.width=innerWidth*d;fx.height=innerHeight*d;fx.style.width=innerWidth+'px';fx.style.height=innerHeight+'px';f.setTransform(d,0,0,d,0,0)} addEventListener('resize',fit);fit();
function bag(){let a=Object.keys(SHAPES);for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fillQueue(){while(queue.length<7)queue.push(...bag())}
function spawn(type=queue.shift()){fillQueue();piece={type,x:3,y:0,r:0};canHold=true;lastAction='spawn';lockAt=0;lockMoves=0;if(collides(piece))gameOver();renderMinis()}
function cells(p=piece,r=p.r){return SHAPES[p.type][r].map(([x,y])=>[x+p.x,y+p.y])}
function collides(p,dx=0,dy=0,r=p.r){return SHAPES[p.type][r].some(([x,y])=>{x+=p.x+dx;y+=p.y+dy;return x<0||x>=COLS||y>=ROWS||(y>=0&&board[y][x])})}
function move(dx,dy,soft=false){if(!piece||collides(piece,dx,dy))return false;piece.x+=dx;piece.y+=dy;lastAction=dy?'drop':'move';if(soft){score++;updateUI()}resetLock();return true}
function rotate(dir){if(!piece||piece.type==='O')return;const from=piece.r,to=(from+dir+4)%4,k=(piece.type==='I'?KICKS.I:KICKS.normal)[from+'>'+to]||[[0,0]];for(const [x,yUp] of k){if(!collides(piece,x,-yUp,to)){piece.x+=x;piece.y-=yUp;piece.r=to;lastAction='rotate';resetLock();sfx('turn');return}}}
function resetLock(){if(lockAt&&lockMoves<15){lockAt=performance.now();lockMoves++}}
function ghostY(){let y=piece.y;while(!collides({...piece,y},0,1))y++;return y}
function hardDrop(){if(!piece)return;const y=ghostY(),d=y-piece.y;piece.y=y;score+=d*2;lastAction='hard';shake=Math.min(9,2+d*.25);sfx('drop');lock()}
function hold(){if(!canHold||!piece)return;const t=held;held=piece.type;canHold=false;if(t){piece={type:t,x:3,y:0,r:0};lastAction='spawn';lockAt=0}else spawn();renderMinis();sfx('hold')}
function lock(){if(!piece)return;for(const [x,y] of cells())if(y>=0)board[y][x]=piece.type;const tspin=piece.type==='T'&&lastAction==='rotate'&&[[piece.x,piece.y],[piece.x+2,piece.y],[piece.x,piece.y+2],[piece.x+2,piece.y+2]].filter(([x,y])=>x<0||x>=COLS||y>=ROWS||(y>=0&&board[y][x])).length>=3;
 const full=[];for(let y=0;y<ROWS;y++)if(board[y].every(Boolean))full.push(y);if(full.length)clearLines(full,tspin);else{combo=-1;spawn()} }
function clearLines(rows,tspin){const n=rows.length;combo++;const difficult=n===4||tspin;const base=tspin?[400,800,1200,1600][n]:[0,100,300,500,800][n];let gain=base*level;if(difficult&&b2b)gain=Math.floor(gain*1.5);if(combo>0)gain+=50*combo*level;b2b=difficult?b2b+1:(n?0:b2b);score+=gain;lines+=n;level=1+Math.floor(lines/10);blast(rows,n,tspin,gain);sfx(tspin?'tspin':n===4?'tetris':'clear',n);setTimeout(()=>{for(const y of rows.sort((a,b)=>a-b))board.splice(y,1),board.unshift(Array(COLS).fill(null));spawn();updateUI()},110)}
function gameOver(){over=true;running=false;piece=null;sfx('over');document.querySelector('#message').innerHTML=`最終スコア <b>${score.toLocaleString()}</b><br>${lines} ライン / レベル ${level}`;document.querySelector('#start').textContent='RETRY';document.querySelector('#overlay').classList.remove('hidden')}
function reset(){board=Array.from({length:ROWS},()=>Array(COLS).fill(null));queue=[];held=null;score=lines=0;level=1;combo=-1;b2b=0;particles=[];rings=[];bolts=[];over=false;paused=false;fillQueue();spawn();updateUI();document.querySelector('#overlay').classList.add('hidden');running=true;last=performance.now();dropAcc=0;initAudio();requestAnimationFrame(loop)}
function fallMs(){return Math.max(55,1000*Math.pow(.8,level-1))}
function update(t){if(!running||paused)return;dropAcc+=t-last;if(dropAcc>=fallMs()){if(!move(0,1)){if(!lockAt)lockAt=t;if(t-lockAt>500)lock()}else lockAt=0;dropAcc=0}handleHeld(t);music(t);last=t}
function handleHeld(t){for(const k of ['ArrowLeft','ArrowRight','ArrowDown'])if(keys[k]){const rate=k==='ArrowDown'?42:38;if(!repeat[k])repeat[k]=t+125;else if(t>=repeat[k]){move(k==='ArrowLeft'?-1:k==='ArrowRight'?1:0,k==='ArrowDown'?1:0,k==='ArrowDown');repeat[k]=t+rate}}}
function loop(t){if(running){update(t);draw();requestAnimationFrame(loop)}}
function block(ctx,x,y,size,color,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=8;ctx.fillRect(x+1,y+1,size-2,size-2);ctx.shadowBlur=0;const gr=ctx.createLinearGradient(x,y,x+size,y+size);gr.addColorStop(0,'#ffffff70');gr.addColorStop(.24,'transparent');gr.addColorStop(1,'#00000045');ctx.fillStyle=gr;ctx.fillRect(x+3,y+3,size-6,size-6);ctx.strokeStyle='#ffffff35';ctx.strokeRect(x+1.5,y+1.5,size-3,size-3);ctx.restore()}
function draw(){g.clearRect(0,0,game.width,game.height);g.fillStyle='#070a12';g.fillRect(0,0,game.width,game.height);g.strokeStyle='#152035';g.lineWidth=.5;for(let x=1;x<COLS;x++){g.beginPath();g.moveTo(x*B,0);g.lineTo(x*B,600);g.stroke()}for(let y=1;y<20;y++){g.beginPath();g.moveTo(0,y*B);g.lineTo(300,y*B);g.stroke()}
 for(let y=HIDDEN;y<ROWS;y++)for(let x=0;x<COLS;x++)if(board[y][x])block(g,x*B,(y-HIDDEN)*B,B,COLORS[board[y][x]]);
 if(piece){const gy=ghostY();for(const [x,y] of cells({...piece,y:gy}))if(y>=HIDDEN)block(g,x*B,(y-HIDDEN)*B,B,COLORS[piece.type],.16);for(const [x,y] of cells())if(y>=HIDDEN)block(g,x*B,(y-HIDDEN)*B,B,COLORS[piece.type])}drawFx()}
function mini(canvas,type,wide=false){const d=2,w=canvas.clientWidth||120,h=canvas.clientHeight||70;canvas.width=w*d;canvas.height=h*d;const c=canvas.getContext('2d');c.scale(d,d);c.clearRect(0,0,w,h);if(!type)return;const cs=Math.min(w/(wide?7:5),h/4),shape=SHAPES[type][0],xs=shape.map(q=>q[0]),ys=shape.map(q=>q[1]),sw=(Math.max(...xs)-Math.min(...xs)+1)*cs,sh=(Math.max(...ys)-Math.min(...ys)+1)*cs,ox=(w-sw)/2-Math.min(...xs)*cs,oy=(h-sh)/2-Math.min(...ys)*cs;shape.forEach(([x,y])=>block(c,ox+x*cs,oy+y*cs,cs,COLORS[type]))}
function renderMinis(){mini(holdC,held);nextCs.forEach((c,i)=>mini(c,queue[i],true))}
function updateUI(){document.querySelector('#score').textContent=score.toLocaleString();document.querySelector('#lines').textContent=lines;document.querySelector('#level').textContent=level;document.querySelector('#combo').textContent=combo>0?'×'+combo:'—';document.querySelector('#b2b').textContent=b2b>1?'×'+b2b:'—';const phase=Math.min(4,Math.floor(lines/10));document.querySelector('#effect').textContent=NAMES[phase];document.querySelector('#meter').style.width=(lines%10)*10+'%';document.documentElement.style.setProperty('--glow',["#53e8ff55","#c65cff55","#ffe44c55","#ff477e55","#ffffff66"][phase])}
function blast(rows,n,tspin,gain){const rect=game.getBoundingClientRect(),phase=Math.min(4,Math.floor(lines/10)),colors=Object.values(COLORS);for(const row of rows){const y=rect.top+(row-HIDDEN+.5)*rect.height/20;for(let i=0;i<35+phase*22;i++){const x=rect.left+Math.random()*rect.width,a=Math.random()*Math.PI*2,s=2+Math.random()*(6+phase*3);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,size:2+Math.random()*5,color:colors[Math.floor(Math.random()*colors.length)],grav:.13})}rings.push({x:rect.left+rect.width/2,y,r:10,life:1,color:colors[(lines+row)%colors.length]});if(phase>=2)for(let i=0;i<2+phase;i++)bolts.push(lightning(rect.left+Math.random()*rect.width,y))}
 if(phase>=1)for(let i=0;i<phase*20;i++)particles.push({x:Math.random()*innerWidth,y:-10,vx:(Math.random()-.5)*3,vy:2+Math.random()*5,life:1,size:3+Math.random()*6,color:colors[i%colors.length],grav:.04,spin:Math.random()});shake=10+phase*3;const text=tspin?(n?'T-SPIN '+(n===2?'DOUBLE':n===3?'TRIPLE':'SINGLE'):'T-SPIN'):n===4?'TETRIS!':['','SINGLE','DOUBLE','TRIPLE'][n];toast(text,combo>0?`+${gain.toLocaleString()} · ${combo} COMBO`:`+${gain.toLocaleString()}`,COLORS[tspin?'T':n===4?'I':'O']);document.querySelector('#flash').classList.remove('go');void document.querySelector('#flash').offsetWidth;document.querySelector('#flash').classList.add('go');updateUI()}
function lightning(x,y){let pts=[{x,y:0}],cy=0;while(cy<y){cy+=15+Math.random()*28;pts.push({x:x+(Math.random()-.5)*55,y:Math.min(cy,y)})}return{pts,life:1}}
function drawFx(){f.setTransform(devicePixelRatio||1,0,0,devicePixelRatio||1,0,0);f.clearRect(0,0,innerWidth,innerHeight);if(shake){const dx=(Math.random()-.5)*shake,dy=(Math.random()-.5)*shake;document.querySelector('.app').style.transform=`translate(${dx}px,${dy}px)`;shake*=.82}else document.querySelector('.app').style.transform='';
 particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.grav;p.life-=.025;f.globalAlpha=Math.max(0,p.life);f.fillStyle=p.color;f.shadowColor=p.color;f.shadowBlur=10;f.save();f.translate(p.x,p.y);f.rotate((p.spin||0)*(1-p.life)*12);f.fillRect(-p.size/2,-p.size/2,p.size,p.size*(p.spin?1.8:1));f.restore();return p.life>0});
 rings=rings.filter(r=>{r.r+=16;r.life-=.055;f.globalAlpha=r.life;f.strokeStyle=r.color;f.lineWidth=3+r.life*5;f.shadowColor=r.color;f.shadowBlur=22;f.beginPath();f.arc(r.x,r.y,r.r,0,Math.PI*2);f.stroke();return r.life>0});
 bolts=bolts.filter(b=>{b.life-=.08;f.globalAlpha=b.life;f.strokeStyle='#d9fbff';f.lineWidth=1+b.life*3;f.shadowColor='#53e8ff';f.shadowBlur=18;f.beginPath();b.pts.forEach((p,i)=>i?f.lineTo(p.x,p.y):f.moveTo(p.x,p.y));f.stroke();return b.life>0});f.globalAlpha=1;f.shadowBlur=0}
function toast(a,b,color){const el=document.querySelector('#toast');el.innerHTML=a+'<small>'+b+'</small>';el.style.color=color;el.classList.remove('go');void el.offsetWidth;el.classList.add('go')}
function initAudio(){if(audio)return;audio=new(window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=.22;master.connect(audio.destination)}
function tone(freq,dur=.08,type='square',vol=.12,when=0,end=freq){if(!audio||!audioOn)return;const o=audio.createOscillator(),v=audio.createGain(),t=audio.currentTime+when;o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,end),t+dur);v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(v);v.connect(master);o.start(t);o.stop(t+dur)}
function noise(dur=.12,vol=.08){if(!audio||!audioOn)return;const len=audio.sampleRate*dur,b=audio.createBuffer(1,len,audio.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);const s=audio.createBufferSource(),v=audio.createGain();s.buffer=b;v.gain.value=vol;s.connect(v);v.connect(master);s.start()}
function sfx(kind,n=1){if(!audioOn)return;if(kind==='turn')tone(420,.035,'square',.045,0,600);if(kind==='drop'){tone(110,.09,'sine',.14,0,42);noise(.05,.04)}if(kind==='hold')tone(250,.09,'triangle',.08,0,500);if(kind==='clear'){[0,4,7].forEach((x,i)=>tone(330*Math.pow(2,x/12),.18,'sawtooth',.07,i*.035,700));noise(.16,.08)}if(kind==='tetris'){[0,7,12,19].forEach((x,i)=>tone(220*Math.pow(2,x/12),.32,'sawtooth',.1,i*.045,900));noise(.3,.13)}if(kind==='tspin'){[0,3,7,10,15].forEach((x,i)=>tone(200*Math.pow(2,x/12),.34,'square',.08,i*.035,1000));noise(.25,.1)}if(kind==='over')for(let i=0;i<5;i++)tone(260-i*35,.2,'sawtooth',.07,i*.13,80)}
function music(t){if(!audio||!audioOn||t<musicTimer)return;const phase=Math.min(4,Math.floor(lines/10)),notes=[110,130.81,146.83,164.81,196,164.81,146.83,130.81],beat=Math.max(105,190-level*4-phase*10);tone(notes[musicStep%8]*(musicStep%4===2?2:1),.09,'triangle',.025);if(phase>=2&&musicStep%2===0)tone(notes[musicStep%8]*2,.045,'square',.018);musicStep++;musicTimer=t+beat}
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp','Space'].includes(e.code))e.preventDefault();if(!running||paused){if(e.code==='KeyP'||e.code==='Escape')togglePause();return}if(e.repeat)return;keys[e.code]=true;if(e.code==='ArrowLeft')move(-1,0);if(e.code==='ArrowRight')move(1,0);if(e.code==='ArrowDown')move(0,1,true);if(e.code==='ArrowUp'||e.code==='KeyX')rotate(1);if(e.code==='KeyZ')rotate(-1);if(e.code==='Space')hardDrop();if(e.code==='KeyC'||e.code==='ShiftLeft')hold();if(e.code==='KeyP'||e.code==='Escape')togglePause()});document.addEventListener('keyup',e=>{keys[e.code]=false;repeat[e.code]=0});
function action(a){if(!running||paused)return;if(a==='left')move(-1,0);if(a==='right')move(1,0);if(a==='down')move(0,1,true);if(a==='cw')rotate(1);if(a==='ccw')rotate(-1);if(a==='drop')hardDrop();if(a==='hold')hold()}
document.querySelectorAll('.touch').forEach(btn=>{let timer,interval;const stop=()=>{clearTimeout(timer);clearInterval(interval)};btn.addEventListener('pointerdown',e=>{e.preventDefault();action(btn.dataset.act);if(['left','right','down'].includes(btn.dataset.act))timer=setTimeout(()=>interval=setInterval(()=>action(btn.dataset.act),55),160)});['pointerup','pointercancel','pointerleave'].forEach(x=>btn.addEventListener(x,stop))});
function togglePause(){if(over)return;if(!running&&paused){paused=false;running=true;last=performance.now();document.querySelector('#overlay').classList.add('hidden');requestAnimationFrame(loop)}else if(running){paused=true;running=false;document.querySelector('#message').textContent='爆発は一時停止中。準備ができたら戻ろう。';document.querySelector('#start').textContent='RESUME';document.querySelector('#overlay').classList.remove('hidden')}}
document.querySelector('#start').onclick=()=>{if(paused)togglePause();else reset()};document.querySelector('#pause').onclick=togglePause;document.querySelector('#sound').onclick=()=>{audioOn=!audioOn;document.querySelector('#sound').textContent=audioOn?'♪':'×';if(audio&&audio.state==='suspended')audio.resume()};
draw();renderMinis();updateUI();
})();
</script>
