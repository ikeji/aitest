<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>派手エフェクト・テトリス</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            background: #111;
            border: 3px solid #444;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        canvas {
            display: block;
            background: #000;
        }

        .game-info {
            position: absolute;
            left: 10px;
            top: 10px;
            font-size: 14px;
            line-height: 1.5;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .next-piece {
            position: absolute;
            right: -80px;
            top: 10px;
            width: 60px;
            height: 60px;
            border: 2px solid #444;
            background: #111;
        }

        .controls {
            position: absolute;
            bottom: -60px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 12px;
            color: #888;
        }

        .effect-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .explosion {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            animation: explode 0.8s ease-out forwards;
        }

        @keyframes explode {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--dx), var(--dy)) scale(0);
                opacity: 0;
            }
        }

        .combo-text {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #ff0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            animation: comboAnim 1s ease-out forwards;
            pointer-events: none;
        }

        @keyframes comboAnim {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 1;
            }
            50% {
                transform: scale(1.5) rotate(180deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(360deg) translateY(-50px);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="300" height="600"></canvas>
        <canvas id="effectCanvas" class="effect-overlay" width="300" height="600"></canvas>
        <div class="game-info">
            <div>SCORE: <span id="score">0</span></div>
            <div>LINES: <span id="lines">0</span></div>
            <div>LEVEL: <span id="level">1</span></div>
            <div>COMBO: <span id="combo">0</span></div>
        </div>
        <canvas id="nextCanvas" class="next-piece" width="60" height="60"></canvas>
        <div class="controls">
            ← → 移動 | ↓ ソフトドロップ | ↑ 回転 | スペース ハードドロップ
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
    <script>
        // ゲーム設定
        const BLOCK_SIZE = 30;
        const BOARD_WIDTH = 10;
        const BOARD_HEIGHT = 20;
        const COLORS = {
            I: '#00ffff',
            O: '#ffff00',
            T: '#ff00ff',
            S: '#00ff00',
            Z: '#ff0000',
            J: '#0000ff',
            L: '#ff8800',
            EMPTY: '#222',
            GHOST: '#444'
        };

        // テトリスピースの形状
        const PIECES = {
            I: [[1,1,1,1]],
            O: [[1,1],[1,1]],
            T: [[0,1,0],[1,1,1]],
            S: [[0,1,1],[1,1,0]],
            Z: [[1,1,0],[0,1,1]],
            J: [[1,0,0],[1,1,1]],
            L: [[0,0,1],[1,1,1]]
        };

        // ゲームクラス
        class Tetris {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.effectCanvas = document.getElementById('effectCanvas');
                this.effectCtx = this.effectCanvas.getContext('2d');
                this.nextCanvas = document.getElementById('nextCanvas');
                this.nextCtx = this.nextCanvas.getContext('2d');
                
                this.board = Array(BOARD_HEIGHT).fill().map(() => Array(BOARD_WIDTH).fill(0));
                this.currentPiece = null;
                this.nextPiece = null;
                this.score = 0;
                this.lines = 0;
                this.level = 1;
                this.combo = 0;
                this.dropTime = 0;
                this.dropInterval = 1000;
                this.gameOver = false;
                this.effectLevel = 0;
                
                this.initAudio();
                this.initControls();
                this.spawnPiece();
                this.gameLoop();
            }

            initAudio() {
                // Web Audio APIで効果音を生成
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                // 各種効果音の生成関数
                this.sounds = {
                    move: () => this.createBeep(200, 0.05),
                    rotate: () => this.createBeep(300, 0.05),
                    drop: () => this.createBeep(150, 0.1),
                    lineClear: () => this.createChord([400, 500, 600], 0.2),
                    tetris: () => this.createChord([400, 500, 600, 800], 0.3),
                    gameOver: () => this.createBeep(100, 0.5),
                    levelUp: () => this.createChord([500, 600, 700], 0.2)
                };
            }

            createBeep(frequency, duration) {
                const oscillator = this.audioContext.createOscillator();
                const gainNode = this.audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(this.audioContext.destination);
                
                oscillator.frequency.setValueAtTime(frequency, this.audioContext.currentTime);
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, this.audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + duration);
                
                oscillator.start(this.audioContext.currentTime);
                oscillator.stop(this.audioContext.currentTime + duration);
            }

            createChord(frequencies, duration) {
                frequencies.forEach(freq => this.createBeep(freq, duration));
            }

            initControls() {
                document.addEventListener('keydown', (e) => {
                    if (this.gameOver) return;
                    
                    switch(e.key) {
                        case 'ArrowLeft':
                            this.movePiece(-1, 0);
                            break;
                        case 'ArrowRight':
                            this.movePiece(1, 0);
                            break;
                        case 'ArrowDown':
                            this.movePiece(0, 1);
                            this.score++;
                            this.updateDisplay();
                            break;
                        case 'ArrowUp':
                            this.rotatePiece();
                            break;
                        case ' ':
                            this.hardDrop();
                            break;
                    }
                });
            }

            spawnPiece() {
                const types = Object.keys(PIECES);
                const type = types[Math.floor(Math.random() * types.length)];
                
                if (!this.nextPiece) {
                    this.nextPiece = {
                        type: type,
                        shape: PIECES[type],
                        x: Math.floor((BOARD_WIDTH - PIECES[type][0].length) / 2),
                        y: 0
                    };
                }
                
                this.currentPiece = this.nextPiece;
                this.nextPiece = {
                    type: types[Math.floor(Math.random() * types.length)],
                    shape: PIECES[this.nextPiece.type],
                    x: Math.floor((BOARD_WIDTH - PIECES[this.nextPiece.type][0].length) / 2),
                    y: 0
                };
                
                if (this.collision()) {
                    this.gameOver = true;
                    this.sounds.gameOver();
                }
                
                this.drawNextPiece();
            }

            collision() {
                for (let y = 0; y < this.currentPiece.shape.length; y++) {
                    for (let x = 0; x < this.currentPiece.shape[y].length; x++) {
                        if (this.currentPiece.shape[y][x]) {
                            const boardX = this.currentPiece.x + x;
                            const boardY = this.currentPiece.y + y;
                            
                            if (boardX < 0 || boardX >= BOARD_WIDTH || 
                                boardY >= BOARD_HEIGHT ||
                                (boardY >= 0 && this.board[boardY][boardX])) {
                                return true;
                            }
                        }
                    }
                }
                return false;
            }

            movePiece(dx, dy) {
                this.currentPiece.x += dx;
                this.currentPiece.y += dy;
                
                if (this.collision()) {
                    this.currentPiece.x -= dx;
                    this.currentPiece.y -= dy;
                    
                    if (dy > 0) {
                        this.placePiece();
                    } else {
                        this.sounds.move();
                    }
                }
            }

            rotatePiece() {
                const rotated = this.currentPiece.shape[0].map((_, i) =>
                    this.currentPiece.shape.map(row => row[i]).reverse()
                );
                
                const previousShape = this.currentPiece.shape;
                this.currentPiece.shape = rotated;
                
                if (this.collision()) {
                    this.currentPiece.shape = previousShape;
                } else {
                    this.sounds.rotate();
                }
            }

            hardDrop() {
                while (!this.collision()) {
                    this.currentPiece.y++;
                    this.score += 2;
                }
                this.currentPiece.y--;
                this.placePiece();
                this.sounds.drop();
                this.updateDisplay();
            }

            placePiece() {
                for (let y = 0; y < this.currentPiece.shape.length; y++) {
                    for (let x = 0; x < this.currentPiece.shape[y].length; x++) {
                        if (this.currentPiece.shape[y][x]) {
                            const boardY = this.currentPiece.y + y;
                            const boardX = this.currentPiece.x + x;
                            if (boardY >= 0) {
                                this.board[boardY][boardX] = this.currentPiece.type;
                            }
                        }
                    }
                }
                
                this.clearLines();
                this.spawnPiece();
            }

            clearLines() {
                let linesCleared = 0;
                
                for (let y = BOARD_HEIGHT - 1; y >= 0; y--) {
                    if (this.board[y].every(cell => cell !== 0)) {
                        this.createLineEffect(y);
                        this.board.splice(y, 1);
                        this.board.unshift(Array(BOARD_WIDTH).fill(0));
                        linesCleared++;
                        y++;
                    }
                }
                
                if (linesCleared > 0) {
                    this.combo++;
                    this.lines += linesCleared;
                    this.updateScore(linesCleared);
                    this.updateLevel();
                    this.createComboEffect(linesCleared);
                } else {
                    this.combo = 0;
                }
                
                this.updateDisplay();
            }

            createLineEffect(line) {
                this.sounds.lineClear();
                
                for (let x = 0; x < BOARD_WIDTH; x++) {
                    this.createExplosion(
                        x * BLOCK_SIZE + BLOCK_SIZE / 2,
                        line * BLOCK_SIZE + BLOCK_SIZE / 2
                    );
                }
            }

            createExplosion(x, y) {
                const effectLevel = Math.floor(this.lines / 10);
                const particleCount = 5 + effectLevel * 3;
                
                for (let i = 0; i < particleCount; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'explosion';
                    particle.style.left = x + 'px';
                    particle.style.top = y + 'px';
                    
                    const angle = (Math.PI * 2 * i) / particleCount;
                    const distance = 50 + Math.random() * 100 * (effectLevel + 1);
                    particle.style.setProperty('--dx', Math.cos(angle) * distance + 'px');
                    particle.style.setProperty('--dy', Math.sin(angle) * distance + 'px');
                    
                    // エフェクトレベルに応じた色
                    const colors = ['#ff0', '#f0f', '#0ff', '#0f0', '#f00'];
                    particle.style.background = colors[effectLevel % colors.length];
                    
                    this.effectCanvas.parentElement.appendChild(particle);
                    
                    setTimeout(() => particle.remove(), 800);
                }
            }

            createComboEffect(linesCleared) {
                if (this.combo > 1) {
                    const comboText = document.createElement('div');
                    comboText.className = 'combo-text';
                    comboText.textContent = `${this.combo} COMBO!`;
                    comboText.style.left = '150px';
                    comboText.style.top = '300px';
                    
                    this.effectCanvas.parentElement.appendChild(comboText);
                    
                    setTimeout(() => comboText.remove(), 1000);
                }
                
                if (linesCleared === 4) {
                    this.sounds.tetris();
                }
            }

            updateScore(linesCleared) {
                const points = [0, 100, 300, 500, 800];
                this.score += points[linesCleared] * this.level;
                
                if (this.combo > 1) {
                    this.score += 50 * this.combo * linesCleared;
                }
            }

            updateLevel() {
                const newLevel = Math.floor(this.lines / 10) + 1;
                if (newLevel > this.level) {
                    this.level = newLevel;
                    this.dropInterval = Math.max(100, 1000 - (this.level - 1) * 100);
                    this.sounds.levelUp();
                }
            }

            updateDisplay() {
                document.getElementById('score').textContent = this.score;
                document.getElementById('lines').textContent = this.lines;
                document.getElementById('level').textContent = this.level;
                document.getElementById('combo').textContent = this.combo;
            }

            drawNextPiece() {
                this.nextCtx.fillStyle = '#111';
                this.nextCtx.fillRect(0, 0, 60, 60);
                
                if (this.nextPiece) {
                    const blockSize = 15;
                    const offsetX = (60 - this.nextPiece.shape[0].length * blockSize) / 2;
                    const offsetY = (60 - this.nextPiece.shape.length * blockSize) / 2;
                    
                    this.nextCtx.fillStyle = COLORS[this.nextPiece.type];
                    
                    for (let y = 0; y < this.nextPiece.shape.length; y++) {
                        for (let x = 0; x < this.nextPiece.shape[y].length; x++) {
                            if (this.nextPiece.shape[y][x]) {
                                this.nextCtx.fillRect(
                                    offsetX + x * blockSize,
                                    offsetY + y * blockSize,
                                    blockSize - 1,
                                    blockSize - 1
                                );
                            }
                        }
                    }
                }
            }

            draw() {
                // ボードの描画
                this.ctx.fillStyle = '#000';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                // 落下中のピースの描画
                if (this.currentPiece) {
                    // ゴーストピースの描画
                    let ghostY = this.currentPiece.y;
                    while (!this.collisionAt(this.currentPiece.x, ghostY + 1)) {
                        ghostY++;
                    }
                    
                    this.ctx.fillStyle = COLORS.GHOST;
                    for (let y = 0; y < this.currentPiece.shape.length; y++) {
                        for (let x = 0; x < this.currentPiece.shape[y].length; x++) {
                            if (this.currentPiece.shape[y][x]) {
                                this.ctx.fillRect(
                                    (this.currentPiece.x + x) * BLOCK_SIZE,
                                    (ghostY + y) * BLOCK_SIZE,
                                    BLOCK_SIZE - 1,
                                    BLOCK_SIZE - 1
                                );
                            }
                        }
                    }
                    
                    // 現在のピースの描画
                    this.ctx.fillStyle = COLORS[this.currentPiece.type];
                    for (let y = 0; y < this.currentPiece.shape.length; y++) {
                        for (let x = 0; x < this.currentPiece.shape[y].length; x++) {
                            if (this.currentPiece.shape[y][x]) {
                                this.ctx.fillRect(
                                    (this.currentPiece.x + x) * BLOCK_SIZE,
                                    (this.currentPiece.y + y) * BLOCK_SIZE,
                                    BLOCK_SIZE - 1,
                                    BLOCK_SIZE - 1
                                );
                            }
                        }
                    }
                }
                
                // 盤面の描画
                for (let y = 0; y < BOARD_HEIGHT; y++) {
                    for (let x = 0; x < BOARD_WIDTH; x++) {
                        if (this.board[y][x]) {
                            this.ctx.fillStyle = COLORS[this.board[y][x]];
                            this.ctx.fillRect(
                                x * BLOCK_SIZE,
                                y * BLOCK_SIZE,
                                BLOCK_SIZE - 1,
                                BLOCK_SIZE - 1
                            );
                        }
                    }
                }
                
                // ゲームオーバー表示
                if (this.gameOver) {
                    this.ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                    
                    this.ctx.fillStyle = '#fff';
                    this.ctx.font = '24px Courier New';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText('GAME OVER', this.canvas.width / 2, this.canvas.height / 2);
                    this.ctx.fillText('リロードして再開', this.canvas.width / 2, this.canvas.height / 2 + 40);
                }
            }

            collisionAt(x, y, shape = this.currentPiece.shape) {
                for (let py = 0; py < shape.length; py++) {
                    for (let px = 0; px < shape[py].length; px++) {
                        if (shape[py][px]) {
                            const boardX = x + px;
                            const boardY = y + py;
                            
                            if (boardX < 0 || boardX >= BOARD_WIDTH || 
                                boardY >= BOARD_HEIGHT ||
                                (boardY >= 0 && this.board[boardY][boardX])) {
                                return true;
                            }
                        }
                    }
                }
                return false;
            }

            gameLoop() {
                const now = Date.now();
                
                if (!this.gameOver) {
                    if (now - this.dropTime > this.dropInterval) {
                        this.movePiece(0, 1);
                        this.dropTime = now;
                    }
                    
                    this.draw();
                }
                
                requestAnimationFrame(() => this.gameLoop());
            }
        }

        // ゲーム開始
        window.addEventListener('load', () => {
            new Tetris();
        });
    </script>
</body>
</html>
